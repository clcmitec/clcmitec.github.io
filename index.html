<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC — Casual Labour Portal</title>

  <!-- ⚡ Speed Optimizations -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <link rel="icon" href="https://mitec.com.my/static/img/logos/logo-footer.png" type="image/png">

  <!-- Non-blocking asynchronous font loading -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Deferred script loading to prevent render blocking -->
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-blue-dark: #07223f;
      --mitec-accent: #0f4a82;
      --bg-base: #f4f5f8;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --error: #ff3b30;
      --success: #34c759;
      --radius: 28px;
      --shadow-vip: 0 20px 40px rgba(7, 34, 63, 0.1);
      --marble-url: url('dark-blue-marble-plain-photo-wallpapers (1).jpg');
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background-color: var(--bg-base);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-main);
    }

    .shell { width: 100%; max-width: 440px; padding: 24px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 54px 32px;
      text-align: center;
      box-shadow: var(--shadow-vip);
      border: 1px solid rgba(9, 34, 83, 0.05);
    }

    .brand { margin-bottom: 54px; }
    .brand img { width: 130px; height: auto; object-fit: contain; margin-bottom: 24px; }

    .title { 
      font-size: 24px; font-weight: 800; margin: 0 0 8px; 
      letter-spacing: -0.03em; color: var(--mitec-blue); 
    }
    .sub { font-size: 14px; color: var(--text-muted); margin: 0; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

    .input-group { position: relative; margin-bottom: 28px; text-align: left; margin-top: 32px;}

    .input-icon {
      position: absolute; left: 16px; top: 18px;
      font-size: 20px; color: var(--mitec-blue); z-index: 2;
    }

    .input-control {
      width: 100%; height: 58px; padding: 0 16px 0 48px;
      font-size: 16px; font-weight: 600;
      color: var(--text-main);
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      background: #f9fafb;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-control:focus {
      border-color: var(--mitec-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(15, 74, 130, 0.08);
    }

    .input-label {
      position: absolute; left: 48px; top: 18px;
      color: var(--text-muted);
      font-size: 16px; font-weight: 500;
      transition: 0.2s ease all;
      pointer-events: none;
    }

    .input-control:focus ~ .input-label,
    .input-control:not(:placeholder-shown) ~ .input-label {
      top: -10px; left: 12px; font-size: 11px;
      color: var(--mitec-accent);
      background: #fff; padding: 0 6px;
      font-weight: 800;
    }

    .btn-primary {
      width: 100%; height: 60px; border: none; border-radius: 20px;
      background: var(--marble-url) center/cover no-repeat;
      background-color: var(--mitec-blue);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
      position: relative; overflow: hidden;
      box-shadow: 0 10px 25px rgba(9, 34, 83, 0.2);
    }

    .btn-primary::before {
      content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.25); transition: opacity 0.2s;
    }

    .btn-primary:active { transform: scale(0.98); }
    .btn-primary span { position: relative; z-index: 1; }

    .btn-link {
      display: inline-block; margin-top: 36px;
      font-size: 13px; font-weight: 700;
      color: var(--mitec-accent); text-decoration: none;
      padding: 12px 20px; border-radius: 14px;
      transition: background 0.2s;
      line-height: 1.5;
    }
    .btn-link:hover { background: rgba(15, 74, 130, 0.05); }

    .msg {
      margin-top: 24px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 24px;
    }
    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }

    .footer {
      width: 100%;
      max-width: 320px;
      margin: 54px auto 32px;
      text-align: center;
    }

    .footer-brand {
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--mitec-blue);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.4;
      display: block;
    }

    .footer-divider {
      width: 30px;
      height: 1.5px;
      background: var(--mitec-blue);
      margin: 14px auto;
      opacity: 0.15;
    }

    .footer-system {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.8;
    }

    .version-tag {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 10px;
      background: #eef1f6;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="shell">
    <div class="card">
      <div class="brand">
        <img src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC Logo">
        <p class="sub">Casual Labour Portal</p>
      </div>

      <div class="input-group">
        <i class="ph-fill ph-identification-card input-icon"></i>
        <input id="docInput" class="input-control" type="text" placeholder=" " autocomplete="off">
        <label class="input-label">IC / Passport Number</label>
      </div>

      <button id="loginBtn" class="btn-primary" onclick="handleLogin()">
        <span>Access</span>
      </button>

      <a href="129c.html" class="btn-link">First Time User?<br>Register / Update Account</a>

      <div id="loginMessage" class="msg"></div>
    </div>

    <footer class="footer">
      <div class="footer-brand">MALAYSIA INTERNATIONAL TRADE & EXHIBITION CENTRE</div>
      <div class="footer-divider"></div>
      <div class="footer-system">
        Casual Labour Management <br> 
        & Coordination System
      </div>
      <div class="version-tag">SYSTEM PROTOCOL V1.2.0</div>
    </footer>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyBP0-dwtWZV-bxbg12bYTIUvkoBtdwnzjKFIj8hSc1my2g0gUHQ-xD2vW_rb8KT4JJSw/exec";

    // Immediate session check before full DOM rendering
    (function checkSession() {
      const savedDoc = localStorage.getItem("mcl_doc_no");
      const savedRecord = localStorage.getItem("mitecWorkerRecord");
      if (savedDoc && savedRecord) {
        window.location.href = "dashboard.html";
      }
    })();

    const docInput = document.getElementById("docInput");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMessage");

    window.addEventListener("DOMContentLoaded", () => {
      if (docInput) docInput.focus();
    });

    function showStatus(text, isError = true) {
      msg.textContent = text;
      msg.className = isError ? "msg error" : "msg success";
      if (isError && text) {
        msg.innerHTML = `<i class="ph-bold ph-warning-circle"></i> ${text}`;
      } else if (text) {
        msg.innerHTML = `<i class="ph-bold ph-check-circle"></i> ${text}`;
      }
    }

    async function handleLogin() {
      const docNo = docInput.value.trim();
      if (!docNo) {
        showStatus("Credentials required for entry.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.querySelector('span').textContent = "Establishing Protocol...";
      showStatus("");

      try {
        const url = `${WEB_APP_URL}?action=check_existing&doc_no=${encodeURIComponent(docNo)}`;
        const res = await fetch(url, { method: "GET", cache: "no-cache" });
        const data = await res.json();

        if (data.ok && data.exists) {
          showStatus("Identity Verified. Entering...", false);
          localStorage.setItem("mitecWorkerRecord", JSON.stringify(data.record));
          localStorage.setItem("mcl_doc_no", docNo);
          setTimeout(() => { window.location.href = "dashboard.html"; }, 150);
        } else {
          showStatus(data.message || "Record not found. Access denied.");
          loginBtn.disabled = false;
          loginBtn.querySelector('span').textContent = "Access";
        }
      } catch (err) {
        showStatus("Registry Timeout. Please retry.");
        loginBtn.disabled = false;
        loginBtn.querySelector('span').textContent = "Access";
      }
    }

    if (docInput) {
      docInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleLogin(); });
    }
  </script>

</body>
</html>
