<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC — Profile</title>
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-blue-dark: #07223f;
      --bg-base: #f4f5f8; 
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --danger: #ff3b30;
      --shadow-soft: 0 12px 36px rgba(0,0,0,0.04);
      --marble-url: url('dark-blue-marble-plain-photo-wallpapers (1).jpg');
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body { 
      margin: 0; 
      padding: 20px 16px 140px; 
      background-color: var(--bg-base);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      color: var(--text-main);
    }

    .shell { max-width: 440px; margin: 0 auto; }

    /* Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand-img { height: 24px; width: auto; }

    /* Profile Hero Section (Marble) */
    .profile-hero {
      background: var(--marble-url) center/cover no-repeat;
      background-color: var(--mitec-blue-dark);
      border-radius: 28px;
      padding: 32px 24px;
      color: #fff;
      text-align: center;
      box-shadow: 0 20px 40px rgba(7, 34, 63, 0.15);
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .profile-hero::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.3); z-index: 0;
    }

    .hero-content { position: relative; z-index: 1; }
    
    .profile-img-large {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      object-fit: cover;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.1);
    }

    .worker-name { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    .worker-role { font-size: 13px; opacity: 0.8; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; }

    /* Info Cards */
    .section-label { 
      font-size: 11px; font-weight: 700; text-transform: uppercase; 
      letter-spacing: 0.12em; color: var(--text-muted); margin: 0 0 10px 8px; 
      display: block; 
    }

    .info-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 8px 20px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 24px;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .info-row:last-child { border-bottom: none; }

    .label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .value { font-size: 14px; font-weight: 700; color: var(--text-main); text-align: right; flex: 1; margin-left: 20px; }

    /* File Links */
    .file-link {
      display: inline-block;
      padding: 6px 12px;
      background: var(--bg-base);
      border-radius: 10px;
      color: var(--mitec-blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    /* Logout Button */
    .logout-btn {
      width: 100%;
      height: 56px;
      background: #fff;
      border: 1px solid rgba(255, 59, 48, 0.2);
      border-radius: 20px;
      color: var(--danger);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .logout-btn:active { background: #fff1f0; transform: scale(0.98); }

    /* Bottom Dock (Same as Dashboard) */
    .bottom-nav {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 360px;
      background: var(--marble-url) center/cover no-repeat;
      background-color: var(--mitec-blue-dark);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      display: flex; justify-content: space-around;
      padding: 12px 8px; box-shadow: 0 15px 35px rgba(7, 34, 63, 0.4);
      z-index: 1000; overflow: hidden;
    }
    .bottom-nav::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4); z-index: 0;
    }
    .nav-item { color: rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; padding: 8px; position: relative; z-index: 1; text-decoration: none; }
    .nav-item svg { width: 24px; height: 24px; stroke-width: 2; }
    .nav-item.active { color: #ffffff; filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); }

  </style>
</head>
<body>

  <div class="shell">
    <div class="topbar">
      <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
    </div>

    <div class="profile-hero">
      <div class="hero-content">
        <img id="profilePhotoPreview" class="profile-img-large" src="https://via.placeholder.com/150" alt="Worker">
        <h1 class="worker-name" id="profileName">LOADING...</h1>
        <div class="worker-role" id="profileRole">Casual Labour</div>
      </div>
    </div>

    <span class="section-label">Identity & Contact</span>
    <div class="info-card">
      <div class="info-row"><span class="label">Doc Type</span><span class="value" id="profileDocType">-</span></div>
      <div class="info-row"><span class="label">IC / Passport</span><span class="value" id="profileDocNo">-</span></div>
      <div class="info-row"><span class="label">Phone</span><span class="value" id="profilePhone">-</span></div>
      <div class="info-row"><span class="label">Email</span><span class="value" id="profileEmail">-</span></div>
    </div>

    <span class="section-label">Personal details</span>
    <div class="info-card">
      <div class="info-row"><span class="label">Gender</span><span class="value" id="profileGender">-</span></div>
      <div class="info-row"><span class="label">Marital Status</span><span class="value" id="profileStatusKahwin">-</span></div>
      <div class="info-row"><span class="label">Address</span><span class="value" id="profileAlamat">-</span></div>
    </div>

    <span class="section-label">Emergency Protocol</span>
    <div class="info-card">
      <div class="info-row"><span class="label">Next of Kin</span><span class="value" id="profileWaris">-</span></div>
      <div class="info-row"><span class="label">Relationship</span><span class="value" id="profileHubungan">-</span></div>
      <div class="info-row"><span class="label">Emergency No.</span><span class="value" id="profileEmergencyNo">-</span></div>
    </div>

    <span class="section-label">Remuneration</span>
    <div class="info-card">
      <div class="info-row"><span class="label">Bank</span><span class="value" id="profileBank">-</span></div>
      <div class="info-row"><span class="label">Account No.</span><span class="value" id="profileAccountNo">-</span></div>
    </div>

    <span class="section-label">Verification Files</span>
    <div class="info-card">
      <div class="info-row"><span class="label">IC Copy</span><span class="value" id="profileIcLink">-</span></div>
      <div class="info-row"><span class="label">Profile Photo</span><span class="value" id="profilePhotoLink">-</span></div>
    </div>

    <button class="logout-btn" onclick="logout()">Log Out of System</button>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="booking.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    </a>
    <a href="https://lookerstudio.google.com/reporting/9b8a64f0-2e03-430d-aa29-bdb31989a35e" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    </a>
    <a href="profile.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </a>
  </nav>

      <script>
    // 🔗 DIRECT SUPABASE CONFIGURATION
    const SUPABASE_URL = "https://oikkdqutclltliaioand.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wtA2_Kg9OluSwrxfU9sEIQ_ZxkBikmo";
    const SUPABASE_TABLE = "casual_labour_profile";

    // Field Mapping: HTML Element ID -> Supabase Column Key
    const fieldMap = {
      profileName: "name_mykad",
      profileEmail: "email",
      profileDocNo: "doc_no",
      profilePhone: "phone",
      profileDocType: "doc_type",
      profileGender: "gender",
      profileAlamat: "alamat",
      profileStatusKahwin: "status_perkahwinan",
      profileBank: "bank",
      profileAccountNo: "Column 19", // Supabase schema column for Account Number
      profileWaris: "nama_waris",
      profileHubungan: "hubungan",
      profileEmergencyNo: "emergency_no"
    };

    function fillProfile(record) {
      if (!record) return;

      // Populate text fields
      Object.keys(fieldMap).forEach(id => {
        const el = document.getElementById(id);
        const dataKey = fieldMap[id];
        if (el) {
          const val = record[dataKey];
          el.textContent = val ? String(val).toUpperCase() : "-";
        }
      });

      // Format Email
      const emailEl = document.getElementById("profileEmail");
      if (emailEl && record.email) {
        emailEl.textContent = record.email.toLowerCase();
      }

      // Hero Profile Photo Preview (Direct thumbnail from Supabase)
      const photoUrl = record.photo_link || "";
      const photoPreview = document.getElementById("profilePhotoPreview");
      if (photoPreview) {
        photoPreview.src = photoUrl || "https://via.placeholder.com/150?text=No+Photo";
      }

      // File Verification Links
      const icUrl = record.ic_link || "";
      const icEl = document.getElementById("profileIcLink");
      if (icEl) {
        icEl.innerHTML = icUrl ? `<a href="${icUrl}" target="_blank" rel="noopener" class="file-link">View Document</a>` : "-";
      }

      const photoLinkEl = document.getElementById("profilePhotoLink");
      if (photoLinkEl) {
        photoLinkEl.innerHTML = photoUrl ? `<a href="${photoUrl}" target="_blank" rel="noopener" class="file-link">View Image</a>` : "-";
      }
    }

    async function loadData() {
      const docNo = localStorage.getItem("mcl_doc_no");
      const cachedData = localStorage.getItem("mitecWorkerRecord");

      // 1. Instant rendering from local cache
      if (cachedData) {
        try {
          fillProfile(JSON.parse(cachedData));
        } catch (e) {
          console.warn("Invalid local cache session.");
        }
      }

      // 2. Redirect if unauthenticated
      if (!docNo) {
        window.location.href = "index.html";
        return;
      }

      // 3. Sync live profile data from Supabase
      try {
        const fetchUrl = `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?doc_no=eq.${encodeURIComponent(docNo)}&select=*`;
        const res = await fetch(fetchUrl, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });

        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0) {
            const freshRecord = data[0];
            fillProfile(freshRecord);
            localStorage.setItem("mitecWorkerRecord", JSON.stringify(freshRecord));
          }
        }
      } catch (e) {
        console.error("Supabase live sync failed, using cached offline record.", e);
      }
    }

    function logout() {
      localStorage.removeItem("mcl_doc_no");
      localStorage.removeItem("mitecWorkerRecord");
      window.location.href = "index.html";
    }

    window.addEventListener("DOMContentLoaded", loadData);
  </script>


</body>
</html>
