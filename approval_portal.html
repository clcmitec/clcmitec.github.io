<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MITEC — Casual Labour Approval Portal</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Arial,sans-serif; background:#f1f5f9; min-height:100vh; padding:20px 12px; color:#0f172a; }

  .top-bar { background:#164B81; color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px; border-radius:8px; margin-bottom:18px; flex-wrap:wrap; }
  .top-bar img { height:40px; filter:brightness(0) invert(1); }
  .top-bar h1 { font-size:1rem; font-weight:900; text-transform:uppercase; }
  .top-bar p { font-size:0.72rem; opacity:0.8; margin-top:2px; }
  #userbox { margin-left:auto; display:none; align-items:center; gap:10px; font-size:0.78rem; }
  #userbox button { background:#fff; color:#164B81; border:none; border-radius:4px; padding:5px 12px; font-weight:700; cursor:pointer; }

  .card { background:#fff; border-radius:8px; padding:22px; max-width:420px; margin:30px auto; box-shadow:0 1px 6px rgba(0,0,0,0.1); }
  .card h2 { font-size:1.1rem; margin-bottom:6px; }
  .card p { font-size:0.82rem; color:#475569; margin-bottom:14px; line-height:1.4; }
  .card input { width:100%; border:1px solid #cbd5e1; border-radius:6px; padding:10px 12px; font-size:0.95rem; margin-bottom:10px; outline:none; }
  .card input:focus { border-color:#164B81; }
  .card button { width:100%; background:#164B81; color:#fff; border:none; border-radius:6px; padding:10px; font-size:0.9rem; font-weight:700; cursor:pointer; margin-bottom:8px; }
  .card button:disabled { opacity:0.5; cursor:not-allowed; }
  #login-msg { font-size:0.8rem; margin-top:6px; min-height:18px; }
  #login-msg.err { color:#b91c1c; } #login-msg.ok { color:#166534; }

  .filters { background:#fff; border-radius:8px; padding:12px 16px; margin-bottom:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .filters label { font-size:0.8rem; font-weight:700; color:#334155; }
  .filters select { border:1px solid #cbd5e1; border-radius:4px; padding:5px 8px; font-size:0.8rem; background:#fff; }
  .btn-refresh { margin-left:auto; background:#164B81; color:#fff; border:none; border-radius:4px; padding:6px 14px; font-size:0.8rem; font-weight:700; cursor:pointer; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .stat { background:#fff; border-radius:8px; padding:12px 14px; border-left:4px solid #cbd5e1; }
  .stat.mine { border-left-color:#f59e0b; } .stat.ok { border-left-color:#16a34a; } .stat.bad { border-left-color:#dc2626; } .stat.all { border-left-color:#164B81; }
  .stat .v { font-size:1.5rem; font-weight:900; } .stat .l { font-size:0.7rem; color:#64748b; text-transform:uppercase; margin-top:2px; }

  .batch-grid { display:flex; flex-direction:column; gap:14px; }
  .batch { background:#fff; border-radius:8px; border:1px solid #e2e8f0; overflow:hidden; }
  .batch-head { background:#234280; color:#fff; padding:10px 16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .batch-head .t { font-weight:900; font-size:0.9rem; } .batch-head .m { font-size:0.7rem; opacity:0.85; }
  .batch-body { padding:12px 16px; }
  .flow { display:flex; gap:10px; flex-wrap:wrap; }
  .step { flex:1; min-width:210px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:10px 12px; }
  .step .st { font-size:0.7rem; font-weight:700; color:#475569; text-transform:uppercase; margin-bottom:5px; }
  .step .em { font-size:0.76rem; color:#334155; margin-bottom:6px; word-break:break-all; }
  .step .dt { font-size:0.68rem; color:#94a3b8; margin-top:4px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:0.68rem; font-weight:700; text-transform:uppercase; }
  .b-PENDING { background:#fef3c7; color:#92400e; } .b-APPROVED { background:#dcfce7; color:#166534; } .b-REJECTED { background:#fee2e2; color:#991b1b; }
  .acts { display:flex; gap:8px; margin-top:8px; }
  .acts button { flex:1; border:none; border-radius:4px; padding:7px; font-size:0.78rem; font-weight:700; cursor:pointer; color:#fff; }
  .acts .ap { background:#16a34a; } .acts .rj { background:#dc2626; }
  .acts button:disabled { opacity:0.3; cursor:not-allowed; }
  .note { font-size:0.68rem; color:#94a3b8; margin-top:6px; }

  table.d { width:100%; border-collapse:collapse; font-size:0.7rem; margin-top:10px; }
  table.d th { background:#f1f5f9; padding:5px 7px; text-align:left; color:#475569; border-bottom:1px solid #e2e8f0; }
  table.d td { padding:5px 7px; border-bottom:1px solid #f1f5f9; }
  .wrap { overflow-x:auto; }
  .pdf { display:inline-block; margin-top:8px; font-size:0.75rem; color:#2563eb; font-weight:700; text-decoration:none; }
  .empty { text-align:center; padding:40px; color:#94a3b8; font-size:0.9rem; }

  #toast { display:none; position:fixed; bottom:22px; left:50%; transform:translateX(-50%); padding:11px 22px; border-radius:8px; font-size:0.85rem; font-weight:700; color:#fff; z-index:99; max-width:90%; text-align:center; }
  .t-ok { background:#16a34a; } .t-err { background:#dc2626; } .t-info { background:#164B81; }
</style>
</head>
<body>

<div class="top-bar">
  <img src="https://mitec.com.my/static/img/logos/logo-footer.png" alt="MiTEC"/>
  <div>
    <h1>Casual Labour — Approval Portal</h1>
    <p>Sign in to review and decide on requisitions assigned to you</p>
  </div>
  <div id="userbox"><span id="whoami"></span><button onclick="logout()">Logout</button></div>
</div>

<!-- LOGIN -->
<div id="login" class="card">
  <h2>🔐 Sign in</h2>
  <p>Enter your registered work email. We'll send a 6-digit code to that address.</p>
  <input id="email" type="email" placeholder="name@mitec.com.my" autocomplete="email"/>
  <button id="btn-send" onclick="sendCode()">Send code</button>
  <div id="step2" style="display:none">
    <input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code"/>
    <button id="btn-verify" onclick="verifyCode()">Verify &amp; sign in</button>
  </div>
  <div id="login-msg"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="filters">
    <label>Department:</label>
    <select id="f-dept" onchange="render()"><option value="">All</option></select>
    <label>Week:</label>
    <select id="f-week" onchange="render()"><option value="">All</option></select>
    <label>Status:</label>
    <select id="f-status" onchange="render()">
      <option value="">All</option>
      <option value="MINE">Awaiting my action</option>
      <option value="APPROVED">Fully approved</option>
      <option value="REJECTED">Rejected</option>
    </select>
    <button class="btn-refresh" onclick="loadData()">🔄 Refresh</button>
  </div>
  <div class="stats">
    <div class="stat all"><div class="v" id="s-all">—</div><div class="l">My batches</div></div>
    <div class="stat mine"><div class="v" id="s-mine">—</div><div class="l">Awaiting my action</div></div>
    <div class="stat ok"><div class="v" id="s-ok">—</div><div class="l">Fully approved</div></div>
    <div class="stat bad"><div class="v" id="s-bad">—</div><div class="l">Rejected</div></div>
  </div>
  <div id="loading" class="empty">⏳ Loading…</div>
  <div id="empty" class="empty" style="display:none">📭 No requisitions found.</div>
  <div class="batch-grid" id="grid"></div>
</div>

<div id="toast"></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx3qDWBhfyeJEEMw4nShZUEztAePxMIWFdE0Lrb_krWJChnjQ6N6zc7x-zrLI3tD3jmSg/exec";
  let TOKEN = null, ME = "", ROWS = [];

  // ---------- helpers ----------
  function sget(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function sset(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
  function sdel(k){ try { sessionStorage.removeItem(k); } catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function $(id){ return document.getElementById(id); }
  function api(params){
    return fetch(GAS_URL + '?' + new URLSearchParams(params).toString()).then(function(r){ return r.json(); });
  }
  function toast(msg, cls){
    var t=$('toast'); t.textContent=msg; t.className=cls||'t-info'; t.style.display='block';
    clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },4500);
  }
  function loginMsg(msg, cls){ var m=$('login-msg'); m.textContent=msg; m.className=cls||''; }

  // ---------- login flow ----------
  function sendCode(){
    var email=$('email').value.trim().toLowerCase();
    if(!email){ loginMsg('Please enter your email.','err'); return; }
    $('btn-send').disabled=true; loginMsg('Sending…');
    api({action:'requestOtp', email:email}).then(function(){
      $('step2').style.display='block';
      loginMsg('If this email is registered, a 6-digit code has been sent. It expires in 10 minutes.','ok');
      $('code').focus();
    }).catch(function(){ loginMsg('Network error. Try again.','err'); })
      .then(function(){ $('btn-send').disabled=false; });
  }
  function verifyCode(){
    var email=$('email').value.trim().toLowerCase(), code=$('code').value.trim();
    if(!code){ loginMsg('Enter the 6-digit code.','err'); return; }
    $('btn-verify').disabled=true; loginMsg('Verifying…');
    api({action:'verifyOtp', email:email, code:code}).then(function(res){
      if(res.status==='success'){
        TOKEN=res.token; ME=email; sset('tok',TOKEN); sset('me',ME); showApp();
      } else { loginMsg(res.message||'Invalid or expired code.','err'); }
    }).catch(function(){ loginMsg('Network error. Try again.','err'); })
      .then(function(){ $('btn-verify').disabled=false; });
  }
  function logout(){
    TOKEN=null; ME=""; ROWS=[]; sdel('tok'); sdel('me');
    $('app').style.display='none'; $('userbox').style.display='none';
    $('login').style.display='block'; $('step2').style.display='none';
    $('code').value=''; loginMsg('');
  }
  function showApp(){
    $('login').style.display='none'; $('app').style.display='block';
    $('userbox').style.display='flex'; $('whoami').textContent='👤 '+ME;
    loadData();
  }

  // ---------- data ----------
  function loadData(){
    $('loading').style.display='block'; $('grid').innerHTML=''; $('empty').style.display='none';
    api({action:'readAll', token:TOKEN}).then(function(res){
      if(!Array.isArray(res)){
        if(res && res.message==='AUTH'){ toast('Session expired. Please sign in again.','t-err'); logout(); return; }
        throw new Error((res&&res.message)||'Load failed');
      }
      ROWS=res; $('loading').style.display='none'; fillFilters(); render();
    }).catch(function(err){ $('loading').textContent='❌ '+err.message; });
  }
  function fillFilters(){
    var depts=[...new Set(ROWS.map(function(r){return r.department;}))].sort();
    var weeks=[...new Set(ROWS.map(function(r){return String(r.week);}))].sort();
    var fd=$('f-dept').value, fw=$('f-week').value;
    $('f-dept').innerHTML='<option value="">All</option>'+depts.map(function(d){return '<option>'+esc(d)+'</option>';}).join('');
    $('f-week').innerHTML='<option value="">All</option>'+weeks.map(function(w){return '<option value="'+esc(w)+'">WEEK '+esc(w)+'</option>';}).join('');
    $('f-dept').value=fd; $('f-week').value=fw;
  }
  function group(rows){
    var m={};
    rows.forEach(function(r){
      if(!m[r.batchId]) m[r.batchId]={id:r.batchId,dept:r.department,week:r.week,hodEmail:r.hodEmail,dceoEmail:r.dceoEmail,
        hodStatus:r.hodStatus,dceoStatus:r.dceoStatus,hodDate:r.hodDate,dceoDate:r.dceoDate,pdf:r.pdfUrl,rows:[]};
      m[r.batchId].rows.push(r);
    });
    return Object.keys(m).map(function(k){return m[k];});
  }
  function canHod(b){ return String(b.hodEmail).toLowerCase()===ME && b.hodStatus==='PENDING'; }
  function canDceo(b){ return String(b.dceoEmail).toLowerCase()===ME && b.hodStatus==='APPROVED' && b.dceoStatus==='PENDING'; }

  // ---------- render ----------
  function render(){
    var fd=$('f-dept').value, fw=$('f-week').value, fs=$('f-status').value;
    var batches=group(ROWS.filter(function(r){ return (!fd||r.department===fd)&&(!fw||String(r.week)===fw); }));
    batches=batches.filter(function(b){
      if(fs==='MINE') return canHod(b)||canDceo(b);
      if(fs==='APPROVED') return b.dceoStatus==='APPROVED';
      if(fs==='REJECTED') return b.hodStatus==='REJECTED'||b.dceoStatus==='REJECTED';
      return true;
    });
    $('s-all').textContent=batches.length;
    $('s-mine').textContent=batches.filter(function(b){return canHod(b)||canDceo(b);}).length;
    $('s-ok').textContent=batches.filter(function(b){return b.dceoStatus==='APPROVED';}).length;
    $('s-bad').textContent=batches.filter(function(b){return b.hodStatus==='REJECTED'||b.dceoStatus==='REJECTED';}).length;

    batches.sort(function(a,b){
      var am=(canHod(a)||canDceo(a))?0:1, bm=(canHod(b)||canDceo(b))?0:1;
      return am-bm || String(b.id).localeCompare(String(a.id));
    });

    var grid=$('grid'); grid.innerHTML='';
    $('empty').style.display=batches.length?'none':'block';
    batches.forEach(function(b){
      var cost=b.rows.reduce(function(s,r){return s+r.wages;},0);
      var pax=b.rows.reduce(function(s,r){return s+r.pt;},0);
      var rowsHtml=b.rows.slice(0,6).map(function(r){
        return '<tr><td>'+esc(r.date)+' ('+esc(r.day)+')</td><td>'+esc(r.shift)+'</td><td>'+r.pt+' pax</td><td>'+r.hours+' hrs</td><td>RM '+r.rate.toFixed(2)+'</td><td><b>RM '+r.wages.toFixed(2)+'</b></td></tr>';
      }).join('');
      if(b.rows.length>6) rowsHtml+='<tr><td colspan="6" style="text-align:center;color:#94a3b8;">… and '+(b.rows.length-6)+' more rows. See PDF.</td></tr>';

      var h=canHod(b), d=canDceo(b);
      var hodNote = String(b.hodEmail).toLowerCase()===ME ? '' : '<div class="note">Only the assigned HOD can act here.</div>';
      var dceoNote = String(b.dceoEmail).toLowerCase()===ME ? (b.hodStatus!=='APPROVED'?'<div class="note">Unlocks after HOD approval.</div>':'') : '<div class="note">Only the assigned DCEO can act here.</div>';

      var el=document.createElement('div'); el.className='batch';
      el.innerHTML=
        '<div class="batch-head"><div><div class="t">🏢 '+esc(b.dept)+' | 📅 WEEK '+esc(b.week)+'</div><div class="m">'+esc(b.id)+'</div></div>'+
        '<div style="font-size:0.78rem;">Est. Cost: <b>RM '+cost.toFixed(2)+'</b> | '+pax+' Pax</div></div>'+
        '<div class="batch-body"><div class="flow">'+
          '<div class="step"><div class="st">① HOD Verification</div><div class="em">📧 '+esc(b.hodEmail)+'</div>'+
            '<span class="badge b-'+esc(b.hodStatus)+'">'+esc(b.hodStatus)+'</span><div class="dt">'+(b.hodDate?'🕐 '+esc(b.hodDate):'')+'</div>'+
            '<div class="acts"><button class="ap" data-batch="'+esc(b.id)+'" data-level="HOD" data-act="APPROVED" data-label="'+esc(b.dept)+' Week '+esc(b.week)+'" '+(h?'':'disabled')+'>✔ Approve</button>'+
            '<button class="rj" data-batch="'+esc(b.id)+'" data-level="HOD" data-act="REJECTED" data-label="'+esc(b.dept)+' Week '+esc(b.week)+'" '+(h?'':'disabled')+'>✘ Reject</button></div>'+hodNote+'</div>'+
          '<div class="step"><div class="st">② Deputy CEO Approval</div><div class="em">📧 '+esc(b.dceoEmail)+'</div>'+
            '<span class="badge b-'+esc(b.dceoStatus)+'">'+esc(b.dceoStatus)+'</span><div class="dt">'+(b.dceoDate?'🕐 '+esc(b.dceoDate):'')+'</div>'+
            '<div class="acts"><button class="ap" data-batch="'+esc(b.id)+'" data-level="DCEO" data-act="APPROVED" data-label="'+esc(b.dept)+' Week '+esc(b.week)+'" '+(d?'':'disabled')+'>✔ Approve</button>'+
            '<button class="rj" data-batch="'+esc(b.id)+'" data-level="DCEO" data-act="REJECTED" data-label="'+esc(b.dept)+' Week '+esc(b.week)+'" '+(d?'':'disabled')+'>✘ Reject</button></div>'+dceoNote+'</div>'+
        '</div>'+
        '<div class="wrap"><table class="d"><thead><tr><th>Date</th><th>Shift</th><th>Headcount</th><th>Hours</th><th>Rate</th><th>Wages</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
        (b.pdf?'<a class="pdf" href="'+esc(b.pdf)+'" target="_blank" rel="noopener">📄 View Full PDF</a>':'')+
        '</div>';
      grid.appendChild(el);
    });
  }

  // ---------- decisions ----------
  $('grid').addEventListener('click',function(ev){
    var btn=ev.target.closest('button[data-act]');
    if(!btn||btn.disabled) return;
    var label=btn.dataset.label, level=btn.dataset.level, act=btn.dataset.act, id=btn.dataset.batch;
    if(!confirm((act==='APPROVED'?'Approve':'Reject')+' '+label+' as '+level+'?')) return;
    document.querySelectorAll('#grid button[data-act]').forEach(function(x){x.disabled=true;});
    toast('⏳ Updating…','t-info');
    api({action:'updateBatch', token:TOKEN, batchId:id, level:level, status:act}).then(function(res){
      if(res.status==='success'){ toast('✅ '+level+' '+act,'t-ok'); setTimeout(loadData,1200); }
      else if(res.message==='AUTH'){ toast('Session expired. Sign in again.','t-err'); logout(); }
      else { toast('❌ '+(res.message||'Not allowed'),'t-err'); loadData(); }
    }).catch(function(){ toast('❌ Network error','t-err'); loadData(); });
  });

  $('email').addEventListener('keydown',function(e){ if(e.key==='Enter') sendCode(); });
  $('code').addEventListener('keydown',function(e){ if(e.key==='Enter') verifyCode(); });

  // ---------- init ----------
  TOKEN=sget('tok'); ME=sget('me')||"";
  if(TOKEN && ME) showApp();
</script>
</body>
</html>
