<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC HUB - Attendance History</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #f4f5f8; 
      --card-bg: #ffffff;
      --text-main: #102544;
      --text-muted: #6B7C93;
      --border: #DCE6F2;
      --shadow-soft: 0 10px 30px rgba(35,74,155,.05);
      
      --sapphire: #082567;
      --primary: #234A9B;
      --primary-2: #315FB3;
      --radius: 20px;

      --marble-texture: url('dark-blue-marble-plain-photo-wallpapers%20(1).jpg');
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0; 
      padding: 12px 12px 100px; 
      background-color: var(--bg-base);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell { width: 100%; max-width: 430px; margin: auto; flex: 1; display: flex; flex-direction: column; }

    .hero {
      background: linear-gradient(rgba(4, 17, 48, 0.25), rgba(4, 17, 48, 0.25)), var(--marble-texture);
      background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,.25);
      border-radius: 22px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; margin-bottom: 16px; box-shadow: var(--shadow-soft);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .hero-logo { height: 28px; width: auto; object-fit: contain; filter: brightness(0) invert(1); }

    .date-pill {
      display: flex; align-items: center; background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px;
      padding: 5px 12px; font-size: 10px; font-weight: 800; color: #FFFFFF;
      letter-spacing: 0.04em; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }

    .section-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 12px 4px; }

    /* PREMIUM MOBILE EXTERNAL LAUNCH BAR */
    .cookie-bypass-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-soft);
    }
    .bypass-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .bypass-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .bypass-btn:active {
      background: var(--sapphire);
    }

    /* EMBEDDED REPORT CONTAINER */
    .report-frame-container {
      flex: 1;
      width: 100%;
      min-height: 100%;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      position: relative;
    }

    .report-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* SYSTEM FIXED BOTTOM NAVIGATION */
    .system-nav {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 430px; 
      height: 74px; 
      background: linear-gradient(rgba(4, 17, 48, 0.4), rgba(4, 17, 48, 0.4)), var(--marble-texture);
      background-size: cover; background-position: center; border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px; display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 2px 0; box-shadow: 0 12px 28px rgba(8, 34, 92, 0.4); z-index: 999; overflow: hidden;
    }
    .nav-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
      position: relative; 
      color: rgba(255, 255, 255, 0.45); 
      text-decoration: none; 
      z-index: 1; 
    }
    .nav-item svg { width: 19px; height: 19px; stroke-width: 2; z-index: 2; } 
    
    .nav-label { 
      font-size: 9px; 
      font-weight: 600; 
      letter-spacing: 0.04em; 
      text-transform: uppercase; 
      z-index: 2; 
    }
    
    .nav-item.active { color: #FFFFFF; filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); }
    .nav-item.active::before { 
      content: ''; 
      position: absolute; 
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px; 
      border-radius: 16px; 
      background: rgba(255, 255, 255, 0.12); 
      z-index: 0; 
    }
  </style>
</head>

<script>
  function formatSystemDate() {
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const monthStr = months[now.getMonth()];
    const year = now.getFullYear();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("currentTopDate").textContent = `${day} ${monthStr} ${year}  ${hours}:${minutes}:${seconds}`;
  }

  window.addEventListener("DOMContentLoaded", () => {
    formatSystemDate();
    setInterval(formatSystemDate, 1000);
  });
</script>
