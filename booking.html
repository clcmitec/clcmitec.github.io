<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W18GC0F7SG"></script>
  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MITEC — Shift Booking Portal</title>
  
  <!-- Speed & Async Font Loading (Inter & Caveat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --md-surface: #f4f6f9;
      --md-surface-container: #ffffff;
      --md-on-surface: #1d1d1f;
      --md-on-surface-variant: #51525c;
      --md-outline: #e1e4ea; 

      --mitec-blue: #1B365D;         
      --mitec-blue-hover: #2D68C4;   
      --mitec-accent: #0f4a82;       

      --accent-amber: #b45309;
      --accent-gold: #d97706;
      --accent-red: #be123c;

      --md-font: 'Inter', -apple-system, sans-serif;
      --brand-font: 'Caveat', cursive, sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; font-family: var(--md-font); }
    
    body { 
      background-color: var(--md-surface); 
      color: var(--md-on-surface); 
      padding-bottom: 90px; 
    }

    /* Header Styling */
    .header { 
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      height: 60px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .back-action-arrow {
      color: var(--mitec-blue);
      font-size: 22px;
      text-decoration: none;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(0,0,0,0.08);
      background: #ffffff;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .back-action-arrow:hover, .back-action-arrow:active { 
      background: var(--md-surface);
      transform: translateY(-1px);
    }
    .brand-img { height: 26px; width: auto; }

    .portal-container { max-width: 430px; margin: 0 auto; padding: 16px; }

    /* MITEC Sapphire Profile Card */
    .profile-card { 
      background: linear-gradient(135deg, #1B365D 0%, #0f4a82 100%); 
      border-radius: 20px; 
      color: #fff;
      box-shadow: 0 6px 20px rgba(27, 54, 93, 0.15);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .profile-card::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }
    .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); object-fit: cover; }

    /* Filter Chips Row */
    .filter-chips-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px 0;
      scrollbar-width: none;
    }
    .filter-chips-container::-webkit-scrollbar { display: none; }

    .filter-chip-btn {
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px !important;
      padding: 6px 16px !important;
      transition: all 0.2s ease;
    }
    .filter-chip-btn.active-chip {
      background-color: var(--mitec-blue) !important;
      color: #ffffff !important;
      border-color: var(--mitec-blue) !important;
      box-shadow: 0 2px 8px rgba(27, 54, 93, 0.25);
    }
    .filter-chip-btn.inactive-chip {
      background-color: #ffffff !important;
      color: var(--md-on-surface-variant) !important;
      border: 1px solid var(--md-outline) !important;
    }

    .date-label { 
      font-size: 11px; font-weight: 800; color: var(--mitec-blue); 
      margin: 20px 0 12px 2px; text-transform: uppercase; letter-spacing: 1.2px;
      display: flex; align-items: center; gap: 12px;
    }
    .date-label::after { content: ""; flex: 1; height: 1px; background: var(--md-outline); }

    /* Card Layout & States */
    .card-shift {
      background: var(--md-surface-container);
      border: 1px solid rgba(9, 34, 83, 0.08) !important;
      border-radius: 18px !important;
      box-shadow: 0 4px 16px rgba(9, 34, 83, 0.03);
    }

    .card.locked { opacity: 0.55; filter: grayscale(0.8); pointer-events: none; }

    .card.full-shift {
      background: #fdfefe;
      border-color: var(--md-outline) !important;
    }
    .card.full-shift .card-header,
    .card.full-shift .card-meta {
      opacity: 0.6;
    }

    /* Hot Item Shift: Vibrant Gold Highlight */
    .card.spotlight {
      border: 2px solid var(--accent-gold) !important;
      background: linear-gradient(180deg, #fffdf2 0%, #ffffff 35%);
      animation: hotGlow 2.5s infinite ease-in-out, hotShiftShake 4s infinite ease-in-out;
    }

    @keyframes hotGlow {
      0% { box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2); }
      50% { box-shadow: 0 8px 22px rgba(217, 119, 6, 0.4); }
      100% { box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2); }
    }

    @keyframes hotShiftShake {
      0%, 90%, 100% { transform: translateY(0) rotate(0deg); }
      92% { transform: translateY(-2px) rotate(-0.5deg); }
      94% { transform: translateY(1px) rotate(0.5deg); }
      96% { transform: translateY(-1px) rotate(-0.3deg); }
      98% { transform: translateY(1px) rotate(0.3deg); }
    }

    .spotlight-banner {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      font-size: 11px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Primary Action Buttons */
    .btn-mitec-primary {
      background-color: var(--mitec-blue) !important;
      color: #ffffff !important;
      border: none !important;
      font-weight: 700 !important;
      transition: background-color 0.2s ease, transform 0.2s ease !important;
    }
    .btn-mitec-primary:hover, .btn-mitec-primary:active {
      background-color: var(--mitec-blue-hover) !important;
      transform: translateY(-1px);
    }

    /* Docked Bottom Navigation Bar */
    nav.bottom-nav { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      width: 100%; 
      height: 62px;
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(18px); 
      -webkit-backdrop-filter: blur(18px); 
      z-index: 1000; 
      border-top: 1px solid rgba(0, 0, 0, 0.08); 
      border-radius: 0; 
      padding: 0; 
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -4px 20px rgba(9, 34, 83, 0.06); 
    }

    .bottom-nav .nav-link {
      color: var(--md-on-surface-variant);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: none;
      background: transparent;
      padding: 8px 0;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .bottom-nav .nav-link.active {
      color: var(--mitec-blue) !important;
      background: rgba(9, 34, 83, 0.05) !important;
    }

    /* Loader */
    #sync-loader { 
      position: fixed; 
      inset: 0; 
      background: #ffffff; 
      z-index: 9999; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
    }
    .loader-icon-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; margin-bottom: 16px; }
    .loader-pulse { position: absolute; width: 100%; height: 100%; background: rgba(27, 54, 93, 0.08); border-radius: 50%; animation: fluidPulse 1.8s infinite ease-in-out; }
    .loader-text { font-size: 11px; font-weight: 800; color: var(--mitec-blue); letter-spacing: 1.5px; text-transform: uppercase; animation: textBlink 1.4s infinite ease-in-out; }

    @keyframes fluidPulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
    @keyframes textBlink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- SYNC LOADER -->
  <div id="sync-loader">
    <div class="loader-icon-wrapper">
      <div class="loader-pulse"></div>
      <i class="ph ph-shield-check" style="font-size: 42px; color: var(--mitec-blue); position: relative; z-index: 2;"></i>
    </div>
    <div class="loader-text">Processing Request...</div>
  </div>

  <!-- FIXED HEADER -->
  <header class="header sticky-top d-flex align-items-center justify-content-center px-3">
    <div class="position-absolute start-0 ms-3">
      <a href="javascript:void(0)" onclick="goToPage('dashboard.html')" class="back-action-arrow" title="Return to Dashboard">
        <i class="ph ph-caret-left"></i>
      </a>
    </div>
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="portal-container">
    <!-- PROFILE CARD -->
    <div class="profile-card p-3 mb-3 d-flex align-items-center gap-3">
      <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231B365D'/></svg>" alt="User Profile">
      <div class="profile-info">
        <span class="d-block text-uppercase opacity-75 fw-semibold" style="letter-spacing: 0.8px; font-size: 9px;">Current User</span>
        <h2 id="userNameDisplay" class="h6 fw-bold mb-0">MITEC Casual Labour</h2>
      </div>
    </div>

    <!-- FILTER CHIPS ROW -->
    <div id="filter-container" class="filter-chips-container" style="display:none;"></div>

    <!-- TAB CONTENT PANES -->
    <div class="tab-content">
      <div class="tab-pane fade show active" id="available-view" role="tabpanel"></div>
      <div class="tab-pane fade" id="booked-view" role="tabpanel"></div>
      <div class="tab-pane fade" id="history-view" role="tabpanel"></div>
    </div>
  </div>

  <!-- DOCKED BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <div class="nav nav-pills nav-justified h-100" id="portalTabs" role="tablist">
      <button class="nav-link active d-flex flex-column align-items-center justify-content-center" id="tab-available" data-bs-toggle="tab" data-bs-target="#available-view" type="button" role="tab" onclick="handleTabSwitch(0)">
        <i class="ph ph-calendar-plus fs-5 mb-1"></i>
        <span>Available</span>
      </button>
      <button class="nav-link d-flex flex-column align-items-center justify-content-center" id="tab-booked" data-bs-toggle="tab" data-bs-target="#booked-view" type="button" role="tab" onclick="handleTabSwitch(1)">
        <i class="ph ph-briefcase fs-5 mb-1"></i>
        <span>My Schedule</span>
      </button>
      <button class="nav-link d-flex flex-column align-items-center justify-content-center" id="tab-history" data-bs-toggle="tab" data-bs-target="#history-view" type="button" role="tab" onclick="handleTabSwitch(2)">
        <i class="ph ph-check-square fs-5 mb-1"></i>
        <span>Attendance</span>
      </button>
    </div>
  </nav>

  <!-- JS Logic -->
  <script>
    const REQUIRED_APP_VERSION = "v1.1"; 

    function goToPage(url) { window.location.href = url; }

    if (localStorage.getItem("mcl_app_version") !== REQUIRED_APP_VERSION) {
      localStorage.removeItem("mcl_doc_no");
      localStorage.removeItem("mitecWorkerRecord");
      localStorage.setItem("mcl_app_version", REQUIRED_APP_VERSION);
      window.location.href = "index.html"; 
    }

    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbwcC4H4Nl-MyxnoMhEM67okwHAP9Ha7NKya6WbangXT-U069ayqPfEY53Puxqguu7zf/exec"; 

    let isRequestInProgress = false;
    let activeController = null; 
    let cachedShifts = [];
    let cachedBookings = [];
    let activeFilterDept = "ALL";

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");

      if (!userDocNo) { 
        window.location.href = "index.html"; 
        return; 
      }

      const cleanDocNo = String(userDocNo).trim().replace(/[^0-9A-Za-z]/g, "").toUpperCase();
      localStorage.setItem("mcl_doc_no", cleanDocNo);

      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || record.name_mykad || "MITEC STAFF";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;

      refreshData(cleanDocNo);
    };

    function showLoader(message) {
      const loader = document.getElementById('sync-loader');
      if (message) loader.querySelector('.loader-text').textContent = message;
      loader.style.display = 'flex';
    }

    function refreshData(docNo) {
      if (activeController) activeController.abort(); 
      activeController = new AbortController();
      showLoader("Syncing Master Timelines...");

      fetch(`${SPREADSHEET_URL}?action=getShifts&userDocNo=${encodeURIComponent(docNo)}`, { signal: activeController.signal })
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            cachedShifts = res.allShifts || [];
            cachedBookings = res.myUpcomingEvents || [];
            renderDepartmentChips(cachedShifts);
            renderAvailable(cachedShifts, cachedBookings);
            renderBooked(cachedBookings);
            renderHistoryLog(cachedBookings);
            document.getElementById('sync-loader').style.display = 'none';
          }
        }).catch(err => { 
          if (err.name !== 'AbortError') {
             document.getElementById('sync-loader').style.display = 'none';
          }
        });
    }

    function renderDepartmentChips(shifts) {
      const filterContainer = document.getElementById('filter-container');
      const depts = [...new Set(shifts.map(s => s.dept))];
      
      if (depts.length === 0) {
        filterContainer.style.display = 'none';
        return;
      }

      filterContainer.style.display = 'flex';
      let chipsHtml = `<button class="btn btn-sm filter-chip-btn ${activeFilterDept === 'ALL' ? 'active-chip' : 'inactive-chip'}" onclick="applyDeptFilter('ALL')">ALL</button>`;
      
      depts.forEach(d => {
        chipsHtml += `<button class="btn btn-sm filter-chip-btn ${activeFilterDept === d ? 'active-chip' : 'inactive-chip'}" onclick="applyDeptFilter('${d}')">${d}</button>`;
      });

      filterContainer.innerHTML = chipsHtml;
    }

    function applyDeptFilter(dept) {
      activeFilterDept = dept;
      renderDepartmentChips(cachedShifts);
      renderAvailable(cachedShifts, cachedBookings);
    }

    function handleTabSwitch(index) {
      const filterContainer = document.getElementById('filter-container');
      if (index === 0 && cachedShifts.length > 0) {
        filterContainer.style.display = 'flex';
      } else {
        filterContainer.style.display = 'none';
      }
    }

    function parseDateString(dateStr) {
      if (!dateStr) return new Date(0);
      let clean = String(dateStr).trim().split(' ')[0].replace(/[\/\-]/g, '.');

      if (clean.includes('Mon') || clean.includes('Tue') || clean.includes('Wed') || clean.includes('Thu') || clean.includes('Fri') || clean.includes('Sat') || clean.includes('Sun') || clean.length > 10) {
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d;
      }

      const parts = clean.split('.');
      if (parts.length !== 3) {
        const standardDate = new Date(dateStr);
        if(!isNaN(standardDate.getTime())) return standardDate;
        return new Date(0);
      }
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }

    function formatAttendanceTime(timeVal) {
      if (!timeVal) return "";
      let str = String(timeVal).trim();

      if (str.includes('Dec 30 1899') || str.includes('1899')) {
        let matchedTime = str.match(/(\d{2}:\d{2})(:\d{2})?/);
        if (matchedTime) return matchedTime[1];
      }

      if (str.includes('GMT') || str.includes('2026')) {
        try {
          const d = new Date(timeVal);
          if (!isNaN(d.getTime())) {
            if (d.getFullYear() === 1899) {
              let hh = String(d.getHours()).padStart(2, '0');
              let mm = String(d.getMinutes()).padStart(2, '0');
              return `${hh}:${mm}`;
            }
            let dd = String(d.getDate()).padStart(2, '0');
            let mth = String(d.getMonth() + 1).padStart(2, '0');
            let yyyy = d.getFullYear();
            let hh = String(d.getHours()).padStart(2, '0');
            let mm = String(d.getMinutes()).padStart(2, '0');
            let ss = String(d.getSeconds()).padStart(2, '0');
            return `${dd}.${mth}.${yyyy} ${hh}:${mm}:${ss}`;
          }
        } catch (e) {}
      }

      let cleanDigits = str.replace(/[^0-9]/g, "");
      if (cleanDigits.length === 4 && !str.includes(":")) {
        return cleanDigits.substring(0, 2) + ":" + cleanDigits.substring(2, 4);
      }
      return str;
    }

    function renderAvailable(shifts, bookings) {
      const container = document.getElementById('available-view');
      container.innerHTML = '';
      const today = new Date(); today.setHours(0,0,0,0);

      let upcomingShifts = shifts.filter(s => parseDateString(s.date) >= today);

      if (activeFilterDept !== 'ALL') {
        upcomingShifts = upcomingShifts.filter(s => s.dept === activeFilterDept);
      }

      if (upcomingShifts.length === 0) {
        container.innerHTML = '<p class="text-center py-5 text-muted fst-italic">No upcoming shifts available.</p>';
        return;
      }

      upcomingShifts.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));
      const dates = [...new Set(upcomingShifts.map(s => s.date))];

      dates.forEach(date => {
        container.innerHTML += `<div class="date-label">${date}</div>`;
        const hasBookingToday = bookings.some(b => b.date === date && String(b.status).toUpperCase() !== 'CANCELLED');

        upcomingShifts.filter(s => s.date === date).forEach(s => {
          const myBooking = bookings.find(b => b.shift_id === s.id && String(b.status).toUpperCase() !== 'CANCELLED');
          const isMyShift = !!myBooking;
          const isFull = s.slotsLeft <= 0;
          const isLockedByPolicy = hasBookingToday && !isMyShift;
          
          const hasSpotlight = s.notes && String(s.notes).trim() !== "";

          let badgeClass = 'bg-primary-subtle text-primary border border-primary-subtle';
          let statusPillText = isFull ? 'Full' : s.slotsLeft + ' Left';

          if (isMyShift) {
            const rawStatus = String(myBooking.status).toUpperCase();
            const isWait = rawStatus === 'WAITLIST' || rawStatus === 'WAITING LIST';
            badgeClass = isWait ? 'bg-warning-subtle text-warning-emphasis border border-warning-subtle' : 'bg-success-subtle text-success border border-success-subtle';
            statusPillText = isWait ? 'In Waiting List' : 'Confirmed';
          } else if (isLockedByPolicy) {
            badgeClass = 'bg-danger-subtle text-danger border border-danger-subtle'; statusPillText = 'Locked';
          } else if (isFull) {
            badgeClass = 'bg-danger-subtle text-danger border border-danger-subtle';
          }

          let displayTime = formatAttendanceTime(s.time);

          let spotlightHtml = '';
          if (hasSpotlight && !isMyShift && !isLockedByPolicy) {
            spotlightHtml = `
              <div class="spotlight-banner">
                <i class="ph ph-lightning fs-6 text-warning"></i>
                <span>${s.notes}</span>
              </div>`;
          }

          container.innerHTML += `
            <div class="card card-shift border-0 p-3 mb-3 ${hasSpotlight && !isMyShift && !isLockedByPolicy ? 'spotlight' : ''} ${isFull && !isMyShift && !isLockedByPolicy ? 'full-shift' : ''} ${isLockedByPolicy ? 'locked' : ''}">
              ${spotlightHtml}
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h3 class="h6 fw-bold mb-0" style="color: var(--mitec-blue);">${s.dept}</h3>
                <span class="badge ${badgeClass} text-uppercase px-2 py-1">${statusPillText}</span>
              </div>
              <div class="small text-secondary mb-3">
                <div class="d-flex align-items-center gap-2 fw-semibold"><i class="ph ph-clock fs-6" style="color: var(--mitec-accent);"></i> ${displayTime}</div>
              </div>

              ${isMyShift ? 
                `<button class="btn btn-light text-muted w-100 fw-bold rounded-3" disabled>Shift Booked ✔️</button>` : 
                (isLockedByPolicy ? 
                  `<button class="btn btn-secondary w-100 fw-bold rounded-3 opacity-50" disabled>Locked</button>` :
                  (isFull ? 
                    `<button class="btn btn-outline-warning text-dark w-100 fw-bold rounded-3 d-flex align-items-center justify-content-center gap-2" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', true, this)"><i class="ph ph-clock-afternoon"></i> Join Waitlist</button>` : 
                    `<button class="btn btn-mitec-primary w-100 rounded-3 py-2" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', false, this)">Book Now</button>`
                  )
                )
              }
            </div>`;
        });
      });
    }

    function renderBooked(bookings) {
      const container = document.getElementById('booked-view');
      container.innerHTML = '<div class="date-label">My Registered Schedule</div>';

      container.innerHTML += `
        <div class="alert alert-warning border-warning-subtle rounded-4 p-3 mb-3 small" style="background-color: #fdf4e3; color: #744210;">
          <div class="d-flex align-items-start gap-2 mb-2">
            <i class="ph ph-info fs-6 mt-1" style="color: var(--mitec-blue);"></i>
            <div><b>Confirmed:</b> Attendance is <b>compulsory</b>. You must attend this shift.</div>
          </div>
          <div class="d-flex align-items-start gap-2">
            <i class="ph ph-clock fs-6 text-warning mt-1"></i>
            <div><b>Waiting List:</b> Please check your status regularly. If you are committed to attend, you may request HR to upgrade your status to <b>confirmed</b>.</div>
          </div>
        </div>`;

      const now = new Date(); 
      const today = new Date(); today.setHours(0,0,0,0);

      const activeBookings = bookings.filter(b => String(b.status).toUpperCase() !== 'CANCELLED');
      const upcomingBookings = activeBookings.filter(b => parseDateString(b.date) >= today);

      if (upcomingBookings.length === 0) { 
        container.innerHTML += '<p class="text-center py-5 text-muted">No upcoming duties registered.</p>'; 
        return; 
      }

      upcomingBookings.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));

      upcomingBookings.forEach(b => {
        const rawStatus = String(b.status).toUpperCase();
        const isWait = rawStatus === "WAITLIST" || rawStatus === "WAITING LIST";
        const displayStatusText = isWait ? "Waiting List" : "Confirmed";

        let isLockActive = false;
        try {
          let dateStr = String(b.date).trim().replace(/[\/\-]/g, '.');
          const dateParts = dateStr.split('.');
          let startTimeStr = "00:00";
          if (b.time) startTimeStr = formatAttendanceTime(String(b.time).split('-')[0].trim());

          let shiftHours = 0, shiftMinutes = 0;
          const timeMatch = startTimeStr.match(/^(\d+):(\d+)$/);
          if (timeMatch) {
            shiftHours = parseInt(timeMatch[1]); shiftMinutes = parseInt(timeMatch[2]);
          }

          const shiftStartDateTime = new Date(parseInt(dateParts[2]), parseInt(dateParts[1]) - 1, parseInt(dateParts[0]), shiftHours, shiftMinutes, 0, 0);
          if ((shiftStartDateTime.getTime() - now.getTime()) / (1000 * 60 * 60) < 12) isLockActive = true;
        } catch (e) {}

        let cleanedShiftTime = formatAttendanceTime(b.time);

        let waGroupBtnHtml = '';
        if (!isWait && b.wa_link && String(b.wa_link).trim() !== "") {
          waGroupBtnHtml = `
            <a href="${b.wa_link}" target="_blank" class="btn btn-success w-100 rounded-3 fw-bold my-2 d-flex align-items-center justify-content-center gap-2 shadow-sm" style="background-color: #25D366; border: none;">
              <i class="ph ph-whatsapp-logo fs-5"></i>
              Join Shift WhatsApp Group
            </a>`;
        }

        container.innerHTML += `
          <div class="card card-shift border-0 p-3 mb-3" style="border-left: 5px solid ${isWait ? 'var(--accent-amber)' : 'var(--mitec-blue)'} !important;">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h3 class="h6 fw-bold mb-0" style="color: var(--mitec-blue);">${b.dept}</h3>
              <span class="badge ${isWait ? 'bg-warning-subtle text-warning-emphasis border border-warning-subtle' : 'bg-success-subtle text-success border border-success-subtle'} text-uppercase px-2 py-1">${displayStatusText}</span>
            </div>
            <div class="small text-secondary mb-2">
              <div class="d-flex align-items-center gap-2 fw-semibold mb-1"><i class="ph ph-calendar fs-6" style="color: var(--mitec-accent);"></i> ${b.date}</div>
              <div class="d-flex align-items-center gap-2 fw-semibold"><i class="ph ph-clock fs-6" style="color: var(--mitec-accent);"></i> ${cleanedShiftTime}</div>
            </div>
            
            ${waGroupBtnHtml}

            ${isLockActive ? 
              `<div class="btn btn-light border text-muted w-100 small fw-bold mt-2 d-flex align-items-center justify-content-center gap-2" disabled><i class="ph ph-lock-keyhole"></i> Cancellation Locked (Within 12 Hours)</div>` :
              `<button class="btn btn-outline-danger w-100 fw-bold rounded-3 mt-2" onclick="cancelBooking('${b.shift_id}', this)">Request Cancel</button>`
            }
          </div>`;
      });
    }

    function renderHistoryLog(bookings) {
      const container = document.getElementById('history-view');
      container.innerHTML = '<div class="date-label">Attendance History Ledger</div>';

      const today = new Date(); today.setHours(0,0,0,0);

      const pastBookings = bookings.filter(b => {
        const st = String(b.status).toUpperCase();
        return parseDateString(b.date) < today && (st === 'SUBMITTED' || st === 'CONFIRMED');
      });

      if (pastBookings.length === 0) {
        container.innerHTML += '<p class="text-center py-5 text-muted fst-italic">No past attendance records discovered.</p>';
        return;
      }

      pastBookings.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));

      let tableMarkup = `
        <div class="table-responsive bg-white rounded-4 border shadow-sm mt-2">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small text-uppercase fw-bold" style="color: var(--mitec-blue);">
              <tr>
                <th scope="col" class="py-3 px-3">Date / Dept</th>
                <th scope="col" class="py-3 px-3 text-center" style="width: 140px;">Attendance Status</th>
              </tr>
            </thead>
            <tbody>`;

      pastBookings.forEach(b => {
        let rawAttendance = String(b.attendance || "").trim();

        if (rawAttendance.includes("GMT")) {
          try {
            let d = new Date(rawAttendance);
            if (!isNaN(d.getTime())) {
              let dd = String(d.getDate()).padStart(2, '0');
              let mo = String(d.getMonth() + 1).padStart(2, '0');
              let yy = d.getFullYear();
              let hh = String(d.getHours()).padStart(2, '0');
              let mi = String(d.getMinutes()).padStart(2, '0');
              let ss = String(d.getSeconds()).padStart(2, '0');
              rawAttendance = `${dd}.${mo}.${yy} ${hh}:${mi}:${ss}`;
            }
          } catch(e) {}
        }

        let isNoShow = rawAttendance.toLowerCase() === "no show" || rawAttendance === "" || rawAttendance === "-" || rawAttendance === "0";
        let statusDisplayMarkup = isNoShow ? `<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1 text-uppercase">No Show</span>` : `<span class="badge bg-light border px-2 py-1 fw-bold" style="color: var(--mitec-blue);">${rawAttendance}</span>`;

        tableMarkup += `
          <tr>
            <td class="px-3 py-3">
              <div class="fw-bold small" style="color: var(--mitec-blue);">${b.date}</div>
              <div class="text-muted small fw-semibold">${b.dept}</div>
            </td>
            <td class="px-3 py-3 text-center">${statusDisplayMarkup}</td>
          </tr>`;
      });

      tableMarkup += `</tbody></table></div>`;
      container.innerHTML += tableMarkup;
    }

    function handleBooking(id, date, dept, time, waitlist, element) {
      if (isRequestInProgress) return;
      const rawDocNo = localStorage.getItem("mcl_doc_no") || "";
      const cleanDocNo = String(rawDocNo).trim().replace(/[^0-9A-Za-z]/g, "");

      if (!confirm(waitlist ? `Join waitlist for ${dept}?` : `Book shift for ${dept}?`)) return;

      isRequestInProgress = true;
      if (element) { element.disabled = true; element.style.opacity = "0.4"; element.innerText = "Processing..."; }
      showLoader(waitlist ? "Securing Standby Placement..." : "Booking Selected Shift...");

      let formattedDate = String(date).trim();
      if (formattedDate.includes("-")) {
        formattedDate = formattedDate.split('-').reverse().join('.');
      } else if (formattedDate.includes("/")) {
        formattedDate = formattedDate.replace(/\//g, '.');
      }

      let formattedTime = formatAttendanceTime(time);
      if (formattedTime.includes("-")) {
        formattedTime = formattedTime.split('-').map(t => {
          let segment = t.trim().replace(/[^0-9]/g, "");
          if(segment.length === 4) return segment.substring(0,2) + ":" + segment.substring(2,4);
          return t.trim();
        }).join(" - ");
      } else {
        let cleanTime = formattedTime.replace(/[^0-9]/g, "");
        if (cleanTime.length === 4) {
          formattedTime = cleanTime.substring(0, 2) + ":" + cleanTime.substring(2, 4);
        }
      }

      if (activeController) activeController.abort();
      activeController = new AbortController();

      const targetUrl = `${SPREADSHEET_URL}?action=submit&shiftId=${id}&date=${formattedDate}&dept=${dept}&time=${formattedTime}&userDocNo=${cleanDocNo}${waitlist ? '&isWaitlist=true' : ''}`;

      fetch(targetUrl, { signal: activeController.signal })
        .then(() => window.location.reload())
        .catch(err => { if (err.name !== 'AbortError') isRequestInProgress = false; });
    }

    function cancelBooking(shiftId, element) {
      if (isRequestInProgress) return;
      const rawDocNo = localStorage.getItem("mcl_doc_no") || "";
      const cleanDocNo = String(rawDocNo).trim().replace(/[^0-9A-Za-z]/g, "");

      if (!confirm("Are you sure you want to request cancellation for this duty registration?")) return;

      isRequestInProgress = true;
      if (element) { element.disabled = true; element.style.opacity = "0.4"; element.innerText = "Cancelling..."; }
      showLoader("Processing Cancellation Request...");

      if (activeController) activeController.abort();
      activeController = new AbortController();

      fetch(`${SPREADSHEET_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${cleanDocNo}`, { signal: activeController.signal })
        .then(r => r.json())
        .then(res => { 
          if (!res.ok) alert("Cancellation failed: " + res.msg);
          window.location.reload(); 
        })
        .catch(err => { if (err.name !== 'AbortError') { isRequestInProgress = false; window.location.reload(); } });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
