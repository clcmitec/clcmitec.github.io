<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) - Deferred -->
  <script defer src="https://www.googletagmanager.com/gtag/js?id=G-W18GC0F7SG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W18GC0F7SG');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MITEC — Shift Booking Portal</title>

  <!-- Fonts (Inter + Caveat for Worker Name) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script defer src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Firebase SDKs Compat Layer (For casual_labour_profile) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --background: #eef2f7;
      --foreground: oklch(0.147 0.004 49.3);
      --card: #ffffff;
      --card-foreground: oklch(0.147 0.004 49.3);
      --primary: #063e99;
      --primary-foreground: #ffffff;
      --muted-foreground: #64748b;
      --border: #cad5e2;
      --radius: 0.75rem;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; font-family: var(--font-sans); }

    body {
      background: radial-gradient(circle at 50% 0%, #f8fafc 0%, #e2e8f0 100%);
      color: var(--foreground);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    .header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      height: 58px;
      border-bottom: 1px solid rgba(203, 213, 225, 0.8);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    .back-action-arrow {
      color: var(--foreground);
      font-size: 18px;
      text-decoration: none;
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      border: 1px solid rgba(0,0,0,0.1);
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-img { height: 22px; width: auto; }
    .portal-container { max-width: 440px; margin: 0 auto; padding: 16px; }

    .profile-card {
      background: linear-gradient(135deg, #094ebf 0%, #063e99 65%, #03245c 100%);
      border-radius: var(--radius);
      color: var(--primary-foreground);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 28px -6px rgba(6, 62, 153, 0.38);
    }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8); object-fit: cover;
    }

    #userNameDisplay {
      font-family: 'Caveat', cursive !important;
      font-size: 1.05rem !important;
      font-weight: 700 !important;
      color: var(--primary-foreground);
    }

    .filter-chips-container {
      display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 14px 2px; scrollbar-width: none;
    }
    .filter-chips-container::-webkit-scrollbar { display: none; }

    .filter-chip-btn {
      font-size: 12px; font-weight: 600; border-radius: 20px !important; padding: 7px 16px !important; white-space: nowrap;
    }
    .filter-chip-btn.active-chip { background: #063e99 !important; color: #ffffff !important; }
    .filter-chip-btn.inactive-chip { background: #ffffff !important; color: #334155 !important; border: 1px solid rgba(0,0,0,0.1) !important; }

    .date-label {
      font-size: 12px; font-weight: 700; color: #334155; margin-top: 68px; margin-bottom: 16px;
      text-transform: uppercase; letter-spacing: 0.12em; display: flex; align-items: center; gap: 15px;
    }
    .date-label.first-date { margin-top: 10px; }
    .date-label::after { content: ""; flex: 1; height: 2px; background: var(--border); }

    .card-shift {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(6, 62, 153, 0.12) !important;
      border-radius: var(--radius) !important;
      margin-bottom: 12px !important;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.06);
    }

    .card.locked { opacity: 0.35; filter: grayscale(0.8); pointer-events: none; }
    .card.full-shift { background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%); }

    .badge-shadcn-full { background: #dc2626 !important; color: #ffffff !important; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 4px 9px; }
    .badge-shadcn-left { background: #f1f5f9 !important; color: #1e293b !important; border: 1px solid rgba(0,0,0,0.12) !important; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 4px 9px; }
    .badge-shadcn-wait { background: #fef3c7 !important; color: #92400e !important; border: 1px solid #fcd34d !important; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 4px 9px; }
    .badge-shadcn-confirmed { background: #dcfce7 !important; color: #14532d !important; border: 1px solid #86efac !important; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 4px 9px; }

    .spotlight-banner {
      background: #fef3c7; border: 1px solid #fde68a; color: #92400e; font-size: 11px; font-weight: 600;
      padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }

    .btn-shadcn-primary { background: linear-gradient(180deg, #1b63d7 0%, #063e99 100%) !important; color: #ffffff !important; font-weight: 600 !important; font-size: 13px !important; border-radius: 8px !important; padding: 10px 16px !important; border: none; }
    .btn-shadcn-outline-waitlist { background: #ffffff !important; color: #4b6b94 !important; border: 1px solid rgba(6, 62, 153, 0.28) !important; font-weight: 600 !important; font-size: 13px !important; border-radius: 8px !important; padding: 10px 16px !important; }
    .btn-shadcn-filled-muted { background: #f1f5f9 !important; color: #334155 !important; border: 1px solid #cbd5e1 !important; font-weight: 600 !important; font-size: 13px !important; border-radius: 8px !important; padding: 10px 16px !important; }
    .btn-shadcn-filled-cancel { background: #fef2f2 !important; color: #991b1b !important; border: 1px solid #fca5a5 !important; font-weight: 600 !important; font-size: 13px !important; border-radius: 8px !important; padding: 10px 16px !important; }
    .btn-shadcn-filled-whatsapp { background: #f0fdf4 !important; color: #166534 !important; border: 1px solid #86efac !important; font-weight: 600 !important; font-size: 13px !important; border-radius: 8px !important; padding: 10px 16px !important; }

    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 62px;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); z-index: 1000;
      border-top: 1px solid rgba(203, 213, 225, 0.8);
    }
    .bottom-nav .nav-link { color: #64748b; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .bottom-nav .nav-link.active { color: var(--primary) !important; }

    #sync-loader {
      position: fixed; inset: 0; background: rgba(238, 242, 247, 0.85); backdrop-filter: blur(12px);
      z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .loader-spinner {
      width: 36px; height: 36px; border: 3px solid #cbd5e1; border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px;
    }
    .loader-text { font-size: 12px; font-weight: 700; color: #334155; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="sync-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Processing Request...</div>
  </div>

  <header class="header sticky-top d-flex align-items-center justify-content-center px-3">
    <div class="position-absolute start-0 ms-3">
      <a href="javascript:void(0)" onclick="goToPage('dashboard.html')" class="back-action-arrow" title="Return to Dashboard">
        <i class="ph ph-caret-left"></i>
      </a>
    </div>
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="portal-container">
    <div class="profile-card p-3 mb-3 d-flex align-items-center gap-3">
      <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/></svg>" alt="User Profile">
      <div class="profile-info">
        <span class="d-block text-uppercase fw-semibold" style="letter-spacing: 0.08em; font-size: 10px; opacity: 0.85;">Logged in as </span>
        <h2 id="userNameDisplay" class="mb-0">MITEC Casual Labour</h2>
      </div>
    </div>

    <div id="bannedAlertBox" class="alert alert-danger shadow-sm border-danger align-items-center gap-2 mb-3" style="display: none; font-size: 12px;">
      <i class="ph ph-warning-circle fs-5"></i>
      <div><b>Booking Restricted:</b> Your account is temporarily suspended from booking new shifts. Please contact HR for assistance.</div>
    </div>

    <div id="filter-container" class="filter-chips-container" style="display:none;"></div>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="available-view" role="tabpanel"></div>
      <div class="tab-pane fade" id="booked-view" role="tabpanel"></div>
      <div class="tab-pane fade" id="history-view" role="tabpanel"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav nav-pills nav-justified h-100" id="portalTabs" role="tablist">
      <button class="nav-link active d-flex flex-column align-items-center justify-content-center" id="tab-available" data-bs-toggle="tab" data-bs-target="#available-view" type="button" role="tab" onclick="handleTabSwitch(0)">
        <i class="ph ph-calendar-plus fs-5 mb-1"></i>
        <span>Available</span>
      </button>
      <button class="nav-link d-flex flex-column align-items-center justify-content-center" id="tab-booked" data-bs-toggle="tab" data-bs-target="#booked-view" type="button" role="tab" onclick="handleTabSwitch(1)">
        <i class="ph ph-briefcase fs-5 mb-1"></i>
        <span>My Schedule</span>
      </button>
      <button class="nav-link d-flex flex-column align-items-center justify-content-center" id="tab-history" data-bs-toggle="tab" data-bs-target="#history-view" type="button" role="tab" onclick="handleTabSwitch(2)">
        <i class="ph ph-check-square fs-5 mb-1"></i>
        <span>Attendance</span>
      </button>
    </div>
  </nav>

  <script>
    const REQUIRED_APP_VERSION = "v2.3";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjXs1JPXirpNXduua4I9fH4sdOyByebou8ZOP744S2quQHJAWXeF58-aHzT8ue5f08/exec";

    // Firebase Configuration (For casual_labour_profile)
    const firebaseConfig = {
      apiKey: "AIzaSyA6dkB3OMqK_6ZukKPI8Hnnm5W-u6BoR4",
      authDomain: "mitec-cl-2027.firebaseapp.com",
      projectId: "mitec-cl-2027",
      storageBucket: "mitec-cl-2027.firebasestorage.app",
      messagingSenderId: "42229239032",
      appId: "1:42229239032:web:97f3372e9d86b45fcf7f0d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function goToPage(url) { window.location.href = url; }

    if (localStorage.getItem("mcl_app_version") !== REQUIRED_APP_VERSION) {
      localStorage.removeItem("mcl_doc_no");
      localStorage.removeItem("mitecWorkerRecord");
      localStorage.setItem("mcl_app_version", REQUIRED_APP_VERSION);
      window.location.href = "index.html";
    }

    let isRequestInProgress = false;
    let cachedShifts = [];
    let cachedBookings = [];
    let accessControlMap = {};
    let activeFilterDept = "ALL";

    function toTitleCase(str) {
      if (!str) return "";
      return String(str).toLowerCase().replace(/(^|\s)\S/g, match => match.toUpperCase());
    }

    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");

      if (!userDocNo) {
        window.location.href = "index.html";
        return;
      }

      const docNo = String(userDocNo).trim().replace(/^'/, '');
      localStorage.setItem("mcl_doc_no", docNo);

      let record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      if (!record.name_mykad || !record.document_type) {
        try {
          const profSnap = await db.collection('casual_labour_profile').doc(docNo).get();
          if (profSnap.exists) {
            record = { ...record, ...profSnap.data() };
            localStorage.setItem("mitecWorkerRecord", JSON.stringify(record));
          }
        } catch (e) {
          console.warn("Firestore profile check skipped:", e);
        }
      }

      const rawName = record.full_name || record.name_mykad || "MITEC Casual Labour";
      document.getElementById("userNameDisplay").textContent = toTitleCase(rawName);
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;

      // Always force a fresh fetch or clear stale session cache on initial load to ensure bookings appear immediately
      refreshData(docNo, true);
    };

    function checkUserBanStatus(docNo) {
      const cleanDoc = String(docNo).trim().replace(/^'/, '').toUpperCase();
      const isBanned = accessControlMap[cleanDoc] && accessControlMap[cleanDoc].is_banned;
      document.getElementById("bannedAlertBox").style.display = isBanned ? "flex" : "none";
    }

    function showLoader(message) {
      const loader = document.getElementById('sync-loader');
      if (message) loader.querySelector('.loader-text').textContent = message;
      loader.style.display = 'flex';
    }

    async function refreshData(docNo, showOverlay = true) {
      if (showOverlay) showLoader("Syncing Master Timelines...");

      try {
        const cleanDocNo = String(docNo).trim().replace(/^'/, '');
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getData&doc_no=${encodeURIComponent(cleanDocNo)}`);
        const resData = await response.json();

        accessControlMap = resData.accessControl || {};
        checkUserBanStatus(cleanDocNo);

        cachedShifts = (resData.shifts || []).map(s => ({
          id: s.shift_id,
          date: s.date || '',
          dept: s.dept || '',
          time: s.time || '',
          totalSlots: parseInt(s.slots) || 0,
          slotsLeft: parseInt(s.slotsLeft) || 0,
          notes: s.notes || '',
          status: s.status || 'OPEN',
          wa_link: s.wa_link || ''
        }));

        cachedBookings = resData.bookings || [];

        sessionStorage.setItem(`mcl_portal_cache_${cleanDocNo}`, JSON.stringify({
          allShifts: cachedShifts,
          myUpcomingEvents: cachedBookings,
          accessControlMap: accessControlMap
        }));

        renderDepartmentChips(cachedShifts);
        renderAvailable(cachedShifts, cachedBookings);
        renderBooked(cachedBookings);
        renderHistoryLog(cachedBookings);
      } catch (err) {
        console.error("Google Sheets fetch error:", err);
      } finally {
        document.getElementById('sync-loader').style.display = 'none';
      }
    }

    function renderDepartmentChips(shifts) {
      const filterContainer = document.getElementById('filter-container');
      const depts = [...new Set(shifts.map(s => s.dept))];

      if (depts.length === 0) {
        filterContainer.style.display = 'none';
        return;
      }

      filterContainer.style.display = 'flex';
      let chipsHtml = `<button class="btn btn-sm filter-chip-btn ${activeFilterDept === 'ALL' ? 'active-chip' : 'inactive-chip'}" onclick="applyDeptFilter('ALL')">ALL</button>`;
      depts.forEach(d => {
        chipsHtml += `<button class="btn btn-sm filter-chip-btn ${activeFilterDept === d ? 'active-chip' : 'inactive-chip'}" onclick="applyDeptFilter('${d}')">${d}</button>`;
      });
      filterContainer.innerHTML = chipsHtml;
    }

    function applyDeptFilter(dept) {
      activeFilterDept = dept;
      renderDepartmentChips(cachedShifts);
      renderAvailable(cachedShifts, cachedBookings);
    }

    function handleTabSwitch(index) {
      const filterContainer = document.getElementById('filter-container');
      filterContainer.style.display = (index === 0 && cachedShifts.length > 0) ? 'flex' : 'none';
    }

    function parseDateString(dateStr) {
      if (!dateStr) return new Date(0);
      let clean = String(dateStr).trim().split(' ')[0].replace(/[\/\-]/g, '.');
      const parts = clean.split('.');
      if (parts.length !== 3) {
        const standardDate = new Date(dateStr);
        return !isNaN(standardDate.getTime()) ? standardDate : new Date(0);
      }
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }

    function toggleInstructions(btnEl) {
      const details = document.getElementById("instructionsContent");
      if (!details) return;
      if (details.style.display === "none") {
        details.style.display = "block";
        btnEl.textContent = "Read Less";
      } else {
        details.style.display = "none";
        btnEl.textContent = "Read More...";
      }
    }

    function renderAvailable(shifts, bookings) {
      const container = document.getElementById('available-view');
      const today = new Date(); today.setHours(0,0,0,0);

      let upcomingShifts = shifts.filter(s => {
        const isPast = parseDateString(s.date) < today;
        const isBooked = bookings.some(b => b.shift_id === s.id && String(b.status).toUpperCase() !== 'CANCELLED');
        return !isPast && !isBooked;
      });

      if (activeFilterDept !== 'ALL') {
        upcomingShifts = upcomingShifts.filter(s => s.dept === activeFilterDept);
      }

      if (upcomingShifts.length === 0) {
        container.innerHTML = '<p class="text-center py-5 text-muted fst-italic">No upcoming shifts available.</p>';
        return;
      }

      upcomingShifts.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));
      const dates = [...new Set(upcomingShifts.map(s => s.date))];
      let htmlBuffer = '';

      dates.forEach((date, dateIndex) => {
        htmlBuffer += `<div class="date-label ${dateIndex === 0 ? 'first-date' : ''}">${date}</div>`;
        const hasBookingToday = bookings.some(b => b.date === date && String(b.status).toUpperCase() !== 'CANCELLED');

        upcomingShifts.filter(s => s.date === date).forEach(s => {
          const isFull = s.slotsLeft <= 0;
          const isLockedByPolicy = hasBookingToday;
          const hasSpotlight = s.notes && String(s.notes).trim() !== "";

          let badgeMarkup = `<span class="badge-shadcn-left">${s.slotsLeft} LEFT</span>`;
          if (isFull) badgeMarkup = `<span class="badge-shadcn-full">FULL</span>`;
          if (isLockedByPolicy) badgeMarkup = `<span class="badge-shadcn-full">LOCKED</span>`;

          let spotlightHtml = (hasSpotlight && !isLockedByPolicy)
            ? `<div class="spotlight-banner"><i class="ph ph-lightning fs-6 text-warning"></i><span>${s.notes}</span></div>`
            : '';

          htmlBuffer += `
            <div class="card card-shift p-3 ${isFull && !isLockedByPolicy ? 'full-shift' : ''} ${isLockedByPolicy ? 'locked' : ''}">
              ${spotlightHtml}
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h3 class="h6 fw-semibold mb-0">${s.dept}</h3>
                ${badgeMarkup}
              </div>
              <div class="small text-muted mb-3">
                <div class="d-flex align-items-center gap-2"><i class="ph ph-clock fs-6"></i> ${s.time}</div>
              </div>
              ${isLockedByPolicy
                ? `<button class="btn btn-shadcn-filled-muted w-100 opacity-50" disabled>Locked</button>`
                : (isFull
                    ? `<button class="btn btn-shadcn-outline-waitlist w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', true, this)"><i class="ph ph-clock-afternoon"></i> Join Waitlist</button>`
                    : `<button class="btn btn-shadcn-primary w-100" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', false, this)">Book Now</button>`
                  )
              }
            </div>`;
        });
      });

      container.innerHTML = htmlBuffer;
    }

    function renderBooked(bookings) {
      const container = document.getElementById('booked-view');
      let htmlBuffer = '<div class="date-label first-date">My Registered Schedule</div>';

      htmlBuffer += `
        <div class="card border p-3 mb-3" style="background: #ffffff; border-color: rgba(6, 62, 153, 0.15) !important; border-radius: var(--radius);">
          <div class="d-flex align-items-center gap-2 mb-2">
            <i class="ph ph-info fs-6" style="color: var(--primary);"></i>
            <span class="fw-bold" style="font-size: 12px;">Duty Attendance Guidelines</span>
          </div>
          <div class="d-flex align-items-start gap-2" style="font-size: 11px;">
            <i class="ph ph-check-circle text-success fs-6 mt-0.5"></i>
            <div><b>Confirmed:</b> Attendance is <b>compulsory</b>. You must attend this shift slot.</div>
          </div>
          <div id="instructionsContent" style="display: none; font-size: 11px;" class="mt-2 pt-2 border-top">
            <div class="d-flex align-items-start gap-2">
              <i class="ph ph-clock text-warning fs-6 mt-0.5"></i>
              <div><b>Waiting List:</b> Please check your status regularly.</div>
            </div>
          </div>
          <div class="mt-1 pt-1">
            <button class="btn btn-link p-0 text-decoration-none fw-semibold" style="font-size: 11px; color: var(--primary);" onclick="toggleInstructions(this)">Read More...</button>
          </div>
        </div>`;

      const now = new Date();
      const today = new Date(); today.setHours(0,0,0,0);

      const upcomingBookings = bookings.filter(b => String(b.status).toUpperCase() !== 'CANCELLED' && parseDateString(b.date) >= today);

      if (upcomingBookings.length === 0) {
        htmlBuffer += '<p class="text-center py-5 text-muted small">No upcoming duties registered.</p>';
        container.innerHTML = htmlBuffer;
        return;
      }

      upcomingBookings.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));

      upcomingBookings.forEach(b => {
        const rawStatus = String(b.status).toUpperCase();
        const isWait = rawStatus === "WAITLIST" || rawStatus === "WAITING LIST";
        const badgeMarkup = isWait ? `<span class="badge-shadcn-wait">WAITING LIST</span>` : `<span class="badge-shadcn-confirmed">CONFIRMED</span>`;

        let isLockActive = false;
        try {
          const dateParts = String(b.date).trim().replace(/[\/\-]/g, '.').split('.');
          const startTimeStr = b.time ? String(b.time).split('-')[0].trim() : "00:00";
          const timeMatch = startTimeStr.match(/^(\d+):(\d+)$/);
          const shiftHours = timeMatch ? parseInt(timeMatch[1]) : 0;
          const shiftMinutes = timeMatch ? parseInt(timeMatch[2]) : 0;
          const shiftStartDateTime = new Date(parseInt(dateParts[2]), parseInt(dateParts[1]) - 1, parseInt(dateParts[0]), shiftHours, shiftMinutes, 0, 0);
          if ((shiftStartDateTime.getTime() - now.getTime()) / (1000 * 60 * 60) < 12) isLockActive = true;
        } catch (e) {}

        let waGroupBtnHtml = (!isWait && b.wa_link && String(b.wa_link).trim() !== "")
          ? `<a href="${b.wa_link}" target="_blank" class="btn btn-shadcn-filled-whatsapp w-100 my-2 d-flex align-items-center justify-content-center gap-2"><i class="ph ph-whatsapp-logo fs-5"></i> Join WhatsApp Group</a>`
          : '';

        htmlBuffer += `
          <div class="card card-shift p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h3 class="h6 fw-semibold mb-0">${b.dept}</h3>
              ${badgeMarkup}
            </div>
            <div class="small text-muted mb-2">
              <div class="d-flex align-items-center gap-2 mb-1"><i class="ph ph-calendar fs-6"></i> ${b.date}</div>
              <div class="d-flex align-items-center gap-2"><i class="ph ph-clock fs-6"></i> ${b.time}</div>
            </div>
            ${waGroupBtnHtml}
            ${isLockActive
              ? `<div class="btn btn-shadcn-filled-muted w-100 small mt-2 d-flex align-items-center justify-content-center gap-2" disabled><i class="ph ph-lock-keyhole"></i> Cancellation Locked (Within 12 Hours)</div>`
              : `<button class="btn btn-shadcn-filled-cancel w-100 mt-2" onclick="cancelBooking('${b.shift_id}', '${localStorage.getItem('mcl_doc_no')}', this)">Request Cancel</button>`
            }
          </div>`;
      });

      container.innerHTML = htmlBuffer;
    }

    function renderHistoryLog(bookings) {
      const container = document.getElementById('history-view');
      let htmlBuffer = '<div class="date-label first-date">Attendance History Ledger</div>';
      const today = new Date(); today.setHours(0,0,0,0);

      const pastBookings = bookings.filter(b => {
        const st = String(b.status).toUpperCase();
        return parseDateString(b.date) < today && (st === 'SUBMITTED' || st === 'CONFIRMED');
      });

      if (pastBookings.length === 0) {
        htmlBuffer += '<p class="text-center py-5 text-muted fst-italic">No past attendance records discovered.</p>';
        container.innerHTML = htmlBuffer;
        return;
      }

      pastBookings.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));

      htmlBuffer += `<div class="table-responsive rounded-3 border shadow-sm mt-2 bg-white"><table class="table table-hover align-middle mb-0"><thead class="small text-uppercase fw-semibold" style="background: #f1f5f9;"><tr><th class="py-3 px-3">Date / Dept</th><th class="py-3 px-3 text-center" style="width: 140px;">Attendance Status</th></tr></thead><tbody>`;
      pastBookings.forEach(b => {
        let rawAttendance = String(b.attendance || "").trim();
        let isNoShow = rawAttendance.toLowerCase() === "no show" || rawAttendance === "" || rawAttendance === "-" || rawAttendance === "0";
        let statusDisplayMarkup = isNoShow ? `<span class="badge-shadcn-full">NO SHOW</span>` : `<span class="badge-shadcn-confirmed">${rawAttendance}</span>`;

        htmlBuffer += `<tr><td class="px-3 py-3"><div class="fw-semibold small">${b.date}</div><div class="text-muted small">${b.dept}</div></td><td class="px-3 py-3 text-center">${statusDisplayMarkup}</td></tr>`;
      });
      htmlBuffer += `</tbody></table></div>`;
      container.innerHTML = htmlBuffer;
    }

    async function handleBooking(id, date, dept, time, waitlist, element) {
      if (isRequestInProgress) return;
      const docNo = String(localStorage.getItem("mcl_doc_no") || "").trim().replace(/^'/, '');
      if (!docNo) { alert("Session invalid. Please log in again."); return; }

      const cleanDocNum = docNo.toUpperCase();
      if (accessControlMap[cleanDocNum] && accessControlMap[cleanDocNum].is_banned) {
        alert("Booking Restricted: Your account is temporarily suspended from booking shifts. Please contact HR.");
        return;
      }

      const workerRecord = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      const docType = String(workerRecord.document_type || "MYKAD").trim().toUpperCase();
      const rawFullName = workerRecord.full_name || workerRecord.name_mykad || "MITEC Casual Labour";
      const phone = workerRecord.phone_no || workerRecord.phone || "";

      if (!confirm(waitlist ? `Join waitlist for ${dept}?` : `Book shift for ${dept}?`)) return;

      isRequestInProgress = true;
      if (element) { element.disabled = true; element.style.opacity = "0.4"; element.innerText = "Processing..."; }
      showLoader(waitlist ? "Securing Standby Placement..." : "Booking Selected Shift...");

      const targetShift = cachedShifts.find(s => s.id === id);
      const totalSlots = targetShift ? parseInt(targetShift.totalSlots || 0) : 0;
      const isPriority = accessControlMap[cleanDocNum] && accessControlMap[cleanDocNum].is_priority;

      let status = "SUBMITTED";
      if (waitlist) {
        status = "WAITLIST";
      } else if (totalSlots <= 15) {
        status = (docType === "MYKAD" || isPriority) ? "CONFIRMED" : "WAITLIST";
      }

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "bookShift",
            doc_no: docNo,
            shift_id: id,
            date: date,
            dept: dept,
            time: time,
            status: status,
            is_waitlist: waitlist,
            document_type: docType,
            name: rawFullName,
            phone: phone
          })
        });
        const result = await res.json();

        if (result.success) {
          sessionStorage.removeItem(`mcl_portal_cache_${docNo}`);
          window.location.reload();
        } else {
          alert("Booking failed: " + (result.message || "Sheet error"));
          if (element) { element.disabled = false; element.style.opacity = "1"; element.innerText = "Book Now"; }
        }
      } catch (err) {
        alert("Error: " + err.message);
        if (element) { element.disabled = false; element.style.opacity = "1"; element.innerText = "Book Now"; }
      } finally {
        document.getElementById('sync-loader').style.display = 'none';
        isRequestInProgress = false;
      }
    }

    async function cancelBooking(shiftId, docNo, element) {
      if (isRequestInProgress) return;
      const cleanDoc = String(docNo || localStorage.getItem("mcl_doc_no") || "").trim().replace(/^'/, '');

      if (!confirm("Are you sure you want to request cancellation for this duty registration?")) return;

      isRequestInProgress = true;
      if (element) { element.disabled = true; element.style.opacity = "0.4"; element.innerText = "Cancelling..."; }
      showLoader("Processing Cancellation Request...");

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "cancelBooking",
            doc_no: cleanDoc,
            shift_id: shiftId
          })
        });
        const result = await res.json();

        if (result.success) {
          sessionStorage.removeItem(`mcl_portal_cache_${cleanDoc}`);
          window.location.reload();
        } else {
          alert("Cancellation failed: " + (result.message || ""));
          if (element) { element.disabled = false; element.style.opacity = "1"; element.innerText = "Request Cancel"; }
        }
      } catch (err) {
        alert("Error: " + err.message);
        if (element) { element.disabled = false; element.style.opacity = "1"; element.innerText = "Request Cancel"; }
      } finally {
        document.getElementById('sync-loader').style.display = 'none';
        isRequestInProgress = false;
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
