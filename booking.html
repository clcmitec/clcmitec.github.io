<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>

  <!-- ⚡ Speed Optimizations -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- Defer Google Tag so it NEVER delays Shift Syncing -->
  <script defer src="https://www.googletagmanager.com/gtag/js?id=G-W18GC0F7SG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W18GC0F7SG');
  </script>

  <!-- Deferred script loading to prevent render blocking -->
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-dark-navy: #051330;
      --mitec-gradient: linear-gradient(135deg, #051330 0%, #092253 60%, #153269 100%);
      --bg-slate: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-thin: #e2e8f0;

      --pill-blue-bg: #f0f9ff;
      --pill-blue-text: #092253;
      --pill-blue-border: #e0f2fe;

      --pill-teal-bg: #f0fdfa;
      --pill-teal-text: #0d9488;
      --pill-teal-border: #ccfbf1;

      --accent-amber: #b45309;
      --accent-gold: #d97706;
      --accent-red: #be123c;
      --font-main: 'Trebuchet MS', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { 
      margin: 0; 
      background-color: var(--bg-slate); 
      font-family: var(--font-main); 
      color: var(--text-main); 
      padding-bottom: 120px; 
    }

    .header { 
      position: sticky;
      top: 0;
      z-index: 1100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-thin);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }
    .header-nav-left {
      position: absolute;
      left: 16px;
      display: flex;
      align-items: center;
    }
    .back-action-arrow {
      color: var(--mitec-blue);
      font-size: 22px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.15s ease;
    }
    .back-action-arrow:active { background: #f1f5f9; }
    .brand-img { height: 22px; width: auto; display: block; }

    .container { max-width: 480px; margin: 0 auto; padding: 15px; }

    /* Deep Sapphire Profile Card */
    .profile-card { 
      background: var(--mitec-gradient); 
      border-radius: 18px; 
      padding: 16px 20px; 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      margin: 5px 0 16px 0; 
      color: #fff;
      box-shadow: 0 10px 25px rgba(9, 34, 83, 0.18);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .profile-card::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.25) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }
    .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; background: rgba(255,255,255,0.1); }
    .profile-info span { font-size: 9px; text-transform: uppercase; opacity: 0.75; letter-spacing: 0.8px; }
    .profile-info h2 { font-size: 15px; margin: 2px 0 0 0; font-weight: 700; line-height: 1.2; letter-spacing: 0.2px; }

    /* Filter Chips Row */
    .filter-chips-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px 0;
      scrollbar-width: none;
    }
    .filter-chips-container::-webkit-scrollbar { display: none; }
    .chip {
      background: #ffffff;
      border: 1px solid var(--border-thin);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .chip.active {
      background: var(--mitec-blue);
      color: #ffffff;
      border-color: var(--mitec-blue);
      box-shadow: 0 4px 12px rgba(9, 34, 83, 0.2);
    }

    .date-label { 
      font-size: 11px; font-weight: 800; color: var(--mitec-blue); 
      margin: 24px 0 12px 5px; text-transform: uppercase; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 12px;
    }
    .date-label::after { content: ""; flex: 1; height: 1px; background: var(--border-thin); }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-thin); 
      border-radius: 18px; 
      padding: 20px; 
      margin-bottom: 16px; 
      position: relative; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card.locked { opacity: 0.5; filter: grayscale(0.8); pointer-events: none; }

    /* Dimmed Full Shift Card Styling */
    .card.full-shift {
      background: #fdfefe;
      border-color: #f1f5f9;
    }
    .card.full-shift .card-header,
    .card.full-shift .card-meta {
      opacity: 0.55;
      filter: grayscale(0.2);
    }
    .card.full-shift .btn-waitlist {
      opacity: 1 !important;
      filter: none !important;
      background: #ffffff;
      border: 1.5px solid var(--accent-amber);
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.12);
    }

    /* Hot Item Shift: Vibrant Glow + Subtle Vibration */
    .card.spotlight {
      border: 2px solid var(--accent-gold);
      background: linear-gradient(180deg, #fffdf2 0%, #ffffff 35%);
      animation: hotGlow 2s infinite ease-in-out, hotShiftShake 4s infinite ease-in-out;
    }

    @keyframes hotGlow {
      0% { box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2); }
      50% { box-shadow: 0 8px 25px rgba(217, 119, 6, 0.45); }
      100% { box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2); }
    }

    @keyframes hotShiftShake {
      0%, 90%, 100% { transform: translateY(0) rotate(0deg); }
      92% { transform: translateY(-2px) rotate(-0.5deg); }
      94% { transform: translateY(1px) rotate(0.5deg); }
      96% { transform: translateY(-1px) rotate(-0.3deg); }
      98% { transform: translateY(1px) rotate(0.3deg); }
    }

    .spotlight-banner {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      font-size: 11px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-title { font-size: 18px; font-weight: 700; color: var(--mitec-blue); margin: 0; }

    .status-pill { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; border: 1px solid transparent; }
    .pill-open { background: var(--pill-blue-bg); color: var(--pill-blue-text); border-color: var(--pill-blue-border); }
    .pill-confirmed { background: var(--pill-teal-bg); color: var(--pill-teal-text); border-color: var(--pill-teal-border); }
    .pill-full { background: #fff1f2; color: var(--accent-red); border: 1px solid #fecdd3; }
    .pill-wait { background: #fffbeb; color: var(--accent-amber); border: 1px solid #fef3c7; }

    .card-meta { font-size: 13px; color: var(--text-muted); display: grid; gap: 8px; margin-bottom: 16px; }
    .meta-row { display: flex; align-items: center; gap: 10px; font-weight: 600; }

    .btn-exec { 
      width: 100%; height: 48px; border-radius: 12px; 
      background: var(--mitec-blue); color: #fff; font-size: 13px; 
      font-weight: 700; border: none; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; gap: 8px; 
      box-shadow: 0 4px 12px rgba(9, 34, 83, 0.15); transition: opacity 0.15s ease;
    }
    .btn-exec:active { opacity: 0.85; }
    .btn-waitlist { background: #fff; border: 1.5px solid var(--accent-amber); color: var(--accent-amber); box-shadow: none; }
    .btn-remove { background: transparent; border: 1px solid #fecaca; color: var(--accent-red); margin-top: 12px; box-shadow: none; }

    /* WhatsApp Group Button */
    .btn-wa-group {
      width: 100%; height: 44px; border-radius: 12px; 
      background: #25D366; color: #ffffff; font-size: 13px; 
      font-weight: 700; border: none; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; 
      gap: 8px; text-decoration: none; margin-top: 12px; 
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.22); transition: opacity 0.15s ease;
    }
    .btn-wa-group:active { opacity: 0.85; }

    .btn-locked-notice {
      background: #f1f5f9; color: #94a3b8; border: 1px dashed #cbd5e1; 
      cursor: not-allowed; font-size: 11px; font-weight: 700; 
      text-align: center; width: 100%; height: 42px; border-radius: 10px; 
      display: flex; align-items: center; justify-content: center; 
      margin-top: 12px; gap: 6px; text-transform: uppercase;
    }

    .schedule-notice-box {
      background: #fdf4e3; border: 1px solid #fbd38d; border-radius: 14px; 
      padding: 14px 16px; margin-bottom: 20px; font-size: 12px; 
      line-height: 1.5; color: #744210;
    }
    .notice-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .notice-row:last-child { margin-bottom: 0; }

    .history-table-wrapper {
      background: #ffffff; border: 1px solid var(--border-thin); 
      border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-top: 10px;
    }
    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    .history-table th {
      background: #f8fafc; padding: 14px 12px; font-weight: 800; color: var(--mitec-blue); 
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-thin);
    }
    .history-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-thin); vertical-align: middle; color: var(--text-main); }
    .history-table tr:last-child td { border-bottom: none; }

    .badge-raw-attendance {
      color: var(--mitec-blue); font-weight: 700; font-size: 11px; 
      background: #f1f5f9; padding: 4px 10px; border-radius: 6px; 
      display: inline-block; border: 1px solid var(--border-thin); white-space: nowrap;
    }
    .badge-noshow {
      background: #fff1f2; color: var(--accent-red); font-size: 9px; 
      font-weight: 800; padding: 4px 10px; border-radius: 6px; 
      text-transform: uppercase; border: 1px solid #fecdd3; display: inline-block;
    }

    /* Floating Island Navigation Dock */
    nav.bottom-nav { 
      position: fixed; 
      bottom: 20px; 
      left: 16px; 
      right: 16px; 
      max-width: 448px; 
      margin: 0 auto; 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px); 
      display: flex; 
      padding: 10px 0; 
      border: 1px solid rgba(226, 232, 240, 0.8); 
      z-index: 1000; 
      border-radius: 24px; 
      box-shadow: 0 12px 30px rgba(9, 34, 83, 0.14); 
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; font-size: 9px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    .nav-item.active { color: var(--mitec-blue); }
    .nav-item i { font-size: 22px; }

    #sync-loader { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .loader-icon-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; margin-bottom: 16px; }
    .loader-pulse { position: absolute; width: 100%; height: 100%; background: rgba(9, 34, 83, 0.08); border-radius: 50%; animation: fluidPulse 1.8s infinite ease-in-out; }
    .loader-text { font-size: 11px; font-weight: 800; color: var(--mitec-blue); letter-spacing: 1.5px; text-transform: uppercase; animation: textBlink 1.4s infinite ease-in-out; }

    @keyframes fluidPulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
    @keyframes textBlink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="sync-loader">
    <div class="loader-icon-wrapper">
      <div class="loader-pulse"></div>
      <i class="ph ph-shield-check" style="font-size: 42px; color: var(--mitec-blue); position: relative; z-index: 2;"></i>
    </div>
    <div class="loader-text">Processing Request...</div>
  </div>

  <header class="header">
    <div class="header-nav-left">
      <a href="dashboard.html" class="back-action-arrow" title="Return to Dashboard"><i class="ph ph-caret-left"></i></a>
    </div>
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="container">
    <div class="profile-card">
      <!-- Lightweight SVG avatar fallback -->
      <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230a2e66'/></svg>" alt="Avatar">
      <div class="profile-info"><span>Current User</span><h2 id="userNameDisplay">MITEC Casual Labour</h2></div>
    </div>

    <!-- Filter Chips Row -->
    <div id="filter-container" class="filter-chips-container" style="display:none;"></div>

    <div id="available-view"></div>
    <div id="booked-view" style="display:none;"></div>
    <div id="history-view" style="display:none;"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab(0)"><i class="ph ph-calendar-plus"></i><span>Available</span></div>
    <div class="nav-item" onclick="switchTab(1)"><i class="ph ph-briefcase"></i><span>My Schedule</span></div>
    <div class="nav-item" onclick="switchTab(2)"><i class="ph ph-check-square"></i><span>My Attendance Record</span></div>
  </nav>

  <script>
    // ⚡ Direct Session Protection Check
    (function checkAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      if (!userDocNo) {
        window.location.href = "index.html";
      }
    })();

    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbwcC4H4Nl-MyxnoMhEM67okwHAP9Ha7NKya6WbangXT-U069ayqPfEY53Puxqguu7zf/exec"; 

    let isRequestInProgress = false;
    let activeController = null; 
    let cachedShifts = [];
    let cachedBookings = [];
    let activeFilterDept = "ALL";

    function convertToDirectLink(url) {
      if (!url) return "";
      let stringUrl = String(url);
      if (stringUrl.includes("drive.google.com")) {
        const match = stringUrl.match(/\/file\/d\/([^/?]+)/) || stringUrl.match(/id=([^&]+)/);
        if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}=s160`;
      }
      return stringUrl;
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");

      if (!userDocNo) { 
        window.location.href = "index.html"; 
        return; 
      }

      const cleanDocNo = String(userDocNo).trim().replace(/[^0-9A-Za-z]/g, "").toUpperCase();
      localStorage.setItem("mcl_doc_no", cleanDocNo);

      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "MITEC STAFF";
      if (record.photo_link) {
        document.getElementById("userAvatar").src = convertToDirectLink(record.photo_link);
      }

      refreshData(cleanDocNo);
    };

    function showLoader(message) {
      const loader = document.getElementById('sync-loader');
      if (message) loader.querySelector('.loader-text').textContent = message;
      loader.style.display = 'flex';
    }

    function refreshData(docNo) {
      if (activeController) activeController.abort(); 
      activeController = new AbortController();
      showLoader("Syncing Master Timelines...");

      fetch(`${SPREADSHEET_URL}?action=getShifts&userDocNo=${encodeURIComponent(docNo)}`, { signal: activeController.signal })
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            cachedShifts = res.allShifts || [];
            cachedBookings = res.myUpcomingEvents || [];
            renderDepartmentChips(cachedShifts);
            renderAvailable(cachedShifts, cachedBookings);
            renderBooked(cachedBookings);
            renderHistoryLog(cachedBookings);
            document.getElementById('sync-loader').style.display = 'none';
          }
        }).catch(err => { 
          if (err.name !== 'AbortError') {
             document.getElementById('sync-loader').style.display = 'none';
          }
        });
    }

    function renderDepartmentChips(shifts) {
      const filterContainer = document.getElementById('filter-container');
      const depts = [...new Set(shifts.map(s => s.dept))];

      if (depts.length === 0) {
        filterContainer.style.display = 'none';
        return;
      }

      filterContainer.style.display = 'flex';
      let chipsHtml = `<div class="chip ${activeFilterDept === 'ALL' ? 'active' : ''}" onclick="applyDeptFilter('ALL')">ALL</div>`;

      depts.forEach(d => {
        chipsHtml += `<div class="chip ${activeFilterDept === d ? 'active' : ''}" onclick="applyDeptFilter('${d}')">${d}</div>`;
      });

      filterContainer.innerHTML = chipsHtml;
    }

    function applyDeptFilter(dept) {
      activeFilterDept = dept;
      renderDepartmentChips(cachedShifts);
      renderAvailable(cachedShifts, cachedBookings);
    }

    function parseDateString(dateStr) {
      if (!dateStr) return new Date(0);
      let clean = String(dateStr).trim().split(' ')[0].replace(/[\/\-]/g, '.');

      if (clean.includes('Mon') || clean.includes('Tue') || clean.includes('Wed') || clean.includes('Thu') || clean.includes('Fri') || clean.includes('Sat') || clean.includes('Sun') || clean.length > 10) {
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d;
      }

      const parts = clean.split('.');
      if (parts.length !== 3) {
        const standardDate = new Date(dateStr);
        if(!isNaN(standardDate.getTime())) return standardDate;
        return new Date(0);
      }
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }

    function formatAttendanceTime(timeVal) {
      if (!timeVal) return "";
      let str = String(timeVal).trim();

      if (str.includes('Dec 30 1899') || str.includes('1899')) {
        let matchedTime = str.match(/(\d{2}:\d{2})(:\d{2})?/);
        if (matchedTime) return matchedTime[1];
      }

      if (str.includes('GMT') || str.includes('2026')) {
        try {
          const d = new Date(timeVal);
          if (!isNaN(d.getTime())) {
            if (d.getFullYear() === 1899) {
              let hh = String(d.getHours()).padStart(2, '0');
              let mm = String(d.getMinutes()).padStart(2, '0');
              return `${hh}:${mm}`;
            }
            let dd = String(d.getDate()).padStart(2, '0');
            let mth = String(d.getMonth() + 1).padStart(2, '0');
            let yyyy = d.getFullYear();
            let hh = String(d.getHours()).padStart(2, '0');
            let mm = String(d.getMinutes()).padStart(2, '0');
            let ss = String(d.getSeconds()).padStart(2, '0');
            return `${dd}.${mth}.${yyyy} ${hh}:${mm}:${ss}`;
          }
        } catch (e) {}
      }

      let cleanDigits = str.replace(/[^0-9]/g, "");
      if (cleanDigits.length === 4 && !str.includes(":")) {
        return cleanDigits.substring(0, 2) + ":" + cleanDigits.substring(2, 4);
      }
      return str;
    }

    function renderAvailable(shifts, bookings) {
      const container = document.getElementById('available-view');
      const today = new Date(); today.setHours(0,0,0,0);

      let upcomingShifts = shifts.filter(s => parseDateString(s.date) >= today);

      if (activeFilterDept !== 'ALL') {
        upcomingShifts = upcomingShifts.filter(s => s.dept === activeFilterDept);
      }

      if (upcomingShifts.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:50px; color:#94a3b8; font-style:italic;">No upcoming shifts available.</p>';
        return;
      }

      upcomingShifts.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));
      const dates = [...new Set(upcomingShifts.map(s => s.date))];

      let htmlBuffer = "";

      dates.forEach(date => {
        htmlBuffer += `<div class="date-label">${date}</div>`;
        const hasBookingToday = bookings.some(b => b.date === date && String(b.status).toUpperCase() !== 'CANCELLED');

        upcomingShifts.filter(s => s.date === date).forEach(s => {
          const myBooking = bookings.find(b => b.shift_id === s.id && String(b.status).toUpperCase() !== 'CANCELLED');
          const isMyShift = !!myBooking;
          const isFull = s.slotsLeft <= 0;
          const isLockedByPolicy = hasBookingToday && !isMyShift;

          const hasSpotlight = s.notes && String(s.notes).trim() !== "";

          let pillClass = 'pill-open';
          let statusPillText = isFull ? 'Full' : s.slotsLeft + ' Left';

          if (isMyShift) {
            const rawStatus = String(myBooking.status).toUpperCase();
            const isWait = rawStatus === 'WAITLIST' || rawStatus === 'WAITING LIST';
            pillClass = isWait ? 'pill-wait' : 'pill-confirmed';
            statusPillText = isWait ? 'In a Waiting List' : 'Confirmed';
          } else if (isLockedByPolicy) {
            pillClass = 'pill-full'; statusPillText = 'Locked';
          } else if (isFull) {
            pillClass = 'pill-full';
          }

          let displayTime = formatAttendanceTime(s.time);

          let spotlightHtml = '';
          if (hasSpotlight && !isMyShift && !isLockedByPolicy) {
            spotlightHtml = `
              <div class="spotlight-banner">
                <i class="ph ph-lightning" style="font-size: 16px; color: var(--accent-amber);"></i>
                <span>${s.notes}</span>
              </div>`;
          }

          htmlBuffer += `
            <div class="card ${hasSpotlight && !isMyShift && !isLockedByPolicy ? 'spotlight' : ''} ${isFull && !isMyShift && !isLockedByPolicy ? 'full-shift' : ''} ${isLockedByPolicy ? 'locked' : ''}">
              ${spotlightHtml}
              <div class="card-header">
                <h3 class="card-title">${s.dept}</h3>
                <span class="status-pill ${pillClass}">${statusPillText}</span>
              </div>
              <div class="card-meta">
                <div class="meta-row"><i class="ph ph-clock"></i> ${displayTime}</div>
              </div>

              ${isMyShift ? 
                `<button class="btn-exec" style="background:#f1f5f9; color:#94a3b8; cursor:default; box-shadow:none;">Shift Booked ✔️</button>` : 
                (isLockedByPolicy ? 
                  `<button class="btn-exec" style="background:#e2e2e0; color:#94a3b8; cursor:not-allowed; box-shadow:none;">Locked</button>` :
                  (isFull ? 
                    `<button class="btn-exec btn-waitlist" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', true, this)"><i class="ph ph-clock-afternoon"></i> Join Waitlist</button>` : 
                    `<button class="btn-exec" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', false, this)">Book Now</button>`
                  )
                )
              }
            </div>`;
        });
      });

      container.innerHTML = htmlBuffer;
    }

    function renderBooked(bookings) {
      const container = document.getElementById('booked-view');
      let htmlBuffer = '<div class="date-label">My Registered Schedule</div>';

      htmlBuffer += `
        <div class="schedule-notice-box">
          <div class="notice-row">
            <i class="ph ph-info" style="font-size: 16px; margin-top: 1px; color: var(--pill-teal-text);"></i>
            <div><b>Confirmed:</b> Attendance is <b>compulsory</b>. You must attend to this particular shift slot.</div>
          </div>
          <div class="notice-row" style="margin-top: 8px;">
            <i class="ph ph-clock" style="font-size: 16px; margin-top: 1px; color: var(--accent-amber);"></i>
            <div><b>Waiting List:</b> You are advised to check your status regularly to avoid any misinformation. If you really <b>committed</b> to come, you may ask HR to upgrade your status to <b>confirmed</b>.</div>
          </div>
        </div>`;

      const now = new Date(); 
      const today = new Date(); today.setHours(0,0,0,0);

      const activeBookings = bookings.filter(b => String(b.status).toUpperCase() !== 'CANCELLED');
      const upcomingBookings = activeBookings.filter(b => parseDateString(b.date) >= today);

      if (upcomingBookings.length === 0) { 
        container.innerHTML = htmlBuffer + '<p style="text-align:center; padding:50px; color:#94a3b8;">No upcoming duties registered.</p>'; 
        return; 
      }

      upcomingBookings.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));

      upcomingBookings.forEach(b => {
        const rawStatus = String(b.status).toUpperCase();
        const isWait = rawStatus === "WAITLIST" || rawStatus === "WAITING LIST";
        const displayStatusText = isWait ? "Waiting List" : "Confirmed";

        let isLockActive = false;
        try {
          let dateStr = String(b.date).trim().replace(/[\/\-]/g, '.');
          const dateParts = dateStr.split('.');
          let startTimeStr = "00:00";
          if (b.time) startTimeStr = formatAttendanceTime(String(b.time).split('-')[0].trim());

          let shiftHours = 0, shiftMinutes = 0;
          const timeMatch = startTimeStr.match(/^(\d+):(\d+)$/);
          if (timeMatch) {
            shiftHours = parseInt(timeMatch[1]); shiftMinutes = parseInt(timeMatch[2]);
          }

          const shiftStartDateTime = new Date(parseInt(dateParts[2]), parseInt(dateParts[1]) - 1, parseInt(dateParts[0]), shiftHours, shiftMinutes, 0, 0);
          if ((shiftStartDateTime.getTime() - now.getTime()) / (1000 * 60 * 60) < 12) isLockActive = true;
        } catch (e) {}

        let cleanedShiftTime = formatAttendanceTime(b.time);

        // ⚡ Match with cached master shift to extract notes/spotlight
        const masterShift = cachedShifts.find(s => s.id === b.shift_id);
        const hasNotes = masterShift && masterShift.notes && String(masterShift.notes).trim() !== "";
        const noteText = hasNotes ? masterShift.notes : (b.notes && String(b.notes).trim() !== "" ? b.notes : "");

        let notesHtml = '';
        if (noteText) {
          notesHtml = `
            <div class="spotlight-banner" style="margin-bottom: 12px;">
              <i class="ph ph-lightning" style="font-size: 16px; color: var(--accent-amber);"></i>
              <span>${noteText}</span>
            </div>`;
        }

        let waGroupBtnHtml = '';
        if (!isWait && b.wa_link && String(b.wa_link).trim() !== "") {
          waGroupBtnHtml = `
            <a href="${b.wa_link}" target="_blank" class="btn-wa-group">
              <i class="ph ph-whatsapp-logo" style="font-size: 20px;"></i>
              Join Shift WhatsApp Group
            </a>`;
        }

        htmlBuffer += `
          <div class="card" style="border-left: 4px solid ${isWait ? 'var(--accent-amber)' : 'var(--mitec-blue)'}">
            ${notesHtml}
            <div class="card-header">
              <h3 class="card-title">${b.dept}</h3>
              <span class="status-pill ${isWait ? 'pill-wait' : 'pill-confirmed'}">${displayStatusText}</span>
            </div>
            <div class="card-meta">
              <div class="meta-row"><i class="ph ph-calendar"></i> ${b.date}</div>
              <div class="meta-row"><i class="ph ph-clock"></i> ${cleanedShiftTime}</div>
            </div>
            
            ${waGroupBtnHtml}

            ${isLockActive ? 
              `<div class="btn-locked-notice"><i class="ph ph-lock-keyhole"></i> Cancellation Locked (Within 12 Hours)</div>` :
              `<button class="btn-exec btn-remove" onclick="cancelBooking('${b.shift_id}', this)">Request Cancel</button>`
            }
          </div>`;
      });

      container.innerHTML = htmlBuffer;
    }

    function renderHistoryLog(bookings) {
      const container = document.getElementById('history-view');
      const today = new Date(); today.setHours(0,0,0,0);

      const pastBookings = bookings.filter(b => {
        const st = String(b.status).toUpperCase();
        return parseDateString(b.date) < today && (st === 'SUBMITTED' || st === 'CONFIRMED');
      });

      if (pastBookings.length === 0) {
        container.innerHTML = '<div class="date-label">Attendance History Ledger</div><p style="text-align:center; padding:50px; color:#94a3b8; font-style:italic;">No past attendance records discovered.</p>';
        return;
      }

      pastBookings.sort((a, b) => parseDateString(a.date) - parseDateString(b.date));

      let tableMarkup = `
        <div class="date-label">Attendance History Ledger</div>
        <div class="history-table-wrapper">
          <table class="history-table">
            <thead>
              <tr>
                <th>Date / Dept</th>
                <th style="width: 140px; text-align: center;">Attendance Status</th>
              </tr>
            </thead>
            <tbody>`;

      pastBookings.forEach(b => {
        let rawAttendance = String(b.attendance || "").trim();

        if (rawAttendance.includes("GMT")) {
          try {
            let d = new Date(rawAttendance);
            if (!isNaN(d.getTime())) {
              let dd = String(d.getDate()).padStart(2, '0');
              let mo = String(d.getMonth() + 1).padStart(2, '0');
              let yy = d.getFullYear();
              let hh = String(d.getHours()).padStart(2, '0');
              let mi = String(d.getMinutes()).padStart(2, '0');
              let ss = String(d.getSeconds()).padStart(2, '0');
              rawAttendance = `${dd}.${mo}.${yy} ${hh}:${mi}:${ss}`;
            }
          } catch(e) {}
        }

        let isNoShow = rawAttendance.toLowerCase() === "no show" || rawAttendance === "" || rawAttendance === "-" || rawAttendance === "0";
        let statusDisplayMarkup = isNoShow ? `<span class="badge-noshow">No Show</span>` : `<span class="badge-raw-attendance">${rawAttendance}</span>`;

        tableMarkup += `
          <tr>
            <td>
              <div style="font-weight: 700; color: var(--mitec-blue); font-size: 13px;">${b.date}</div>
              <div style="color: var(--text-muted); font-size: 11px; margin-top: 2px; font-weight: 600;">${b.dept}</div>
            </td>
            <td style="text-align: center;">${statusDisplayMarkup}</td>
          </tr>`;
      });

      tableMarkup += `</tbody></table></div>`;
      container.innerHTML = tableMarkup;
    }

    function switchTab(index) {
      document.getElementById('available-view').style.display = index === 0 ? 'block' : 'none';
      document.getElementById('filter-container').style.display = (index === 0 && cachedShifts.length > 0) ? 'flex' : 'none';
      document.getElementById('booked-view').style.display = index === 1 ? 'block' : 'none';
      document.getElementById('history-view').style.display = index === 2 ? 'block' : 'none';
      const items = document.querySelectorAll('.nav-item');
      items.forEach((it, i) => it.classList.toggle('active', i === index));
    }

    function handleBooking(id, date, dept, time, waitlist, element) {
      if (isRequestInProgress) return;
      const rawDocNo = localStorage.getItem("mcl_doc_no") || "";
      const cleanDocNo = String(rawDocNo).trim().replace(/[^0-9A-Za-z]/g, "");

      if (!confirm(waitlist ? `Join waitlist for ${dept}?` : `Book shift for ${dept}?`)) return;

      isRequestInProgress = true;
      if (element) { element.disabled = true; element.style.opacity = "0.4"; element.innerText = "Processing..."; }
      showLoader(waitlist ? "Securing Standby Placement..." : "Booking Selected Shift...");

      let formattedDate = String(date).trim();
      if (formattedDate.includes("-")) {
        formattedDate = formattedDate.split('-').reverse().join('.');
      } else if (formattedDate.includes("/")) {
        formattedDate = formattedDate.replace(/\//g, '.');
      }

      let formattedTime = formatAttendanceTime(time);
      if (formattedTime.includes("-")) {
        formattedTime = formattedTime.split('-').map(t => {
          let segment = t.trim().replace(/[^0-9]/g, "");
          if(segment.length === 4) return segment.substring(0,2) + ":" + segment.substring(2,4);
          return t.trim();
        }).join(" - ");
      } else {
        let cleanTime = formattedTime.replace(/[^0-9]/g, "");
        if (cleanTime.length === 4) {
          formattedTime = cleanTime.substring(0, 2) + ":" + cleanTime.substring(2, 4);
        }
      }

      if (activeController) activeController.abort();
      activeController = new AbortController();

      const targetUrl = `${SPREADSHEET_URL}?action=submit&shiftId=${id}&date=${formattedDate}&dept=${dept}&time=${formattedTime}&userDocNo=${cleanDocNo}${waitlist ? '&isWaitlist=true' : ''}`;

      fetch(targetUrl, { signal: activeController.signal })
        .then(() => window.location.reload())
        .catch(err => { if (err.name !== 'AbortError') isRequestInProgress = false; });
    }

    function cancelBooking(shiftId, element) {
      if (isRequestInProgress) return;
      const rawDocNo = localStorage.getItem("mcl_doc_no") || "";
      const cleanDocNo = String(rawDocNo).trim().replace(/[^0-9A-Za-z]/g, "");

      if (!confirm("Are you sure you want to request cancellation for this duty registration?")) return;

      isRequestInProgress = true;
      if (element) { element.disabled = true; element.style.opacity = "0.4"; element.innerText = "Cancelling..."; }
      showLoader("Processing Cancellation Request...");

      if (activeController) activeController.abort();
      activeController = new AbortController();

      fetch(`${SPREADSHEET_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${cleanDocNo}`, { signal: activeController.signal })
        .then(r => r.json())
        .then(res => { 
          if (!res.ok) alert("Cancellation failed: " + res.msg);
          window.location.reload(); 
        })
        .catch(err => { if (err.name !== 'AbortError') { isRequestInProgress = false; window.location.reload(); } });
    }
  </script>

</body>
</html>
